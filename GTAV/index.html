<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grand Theft Auto V • TapTap Cloud Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #08090d;
            --card-bg: rgba(22, 27, 34, 0.75);
            --accent-cyan: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --badge-warning: #f59e0b;
        }

        body {
            font-family: 'Noto Sans Khmer', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Lighting / Glow Background */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 320px;
            height: 320px;
            background: rgba(0, 255, 204, 0.12);
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        body::after {
            width: 250px;
            height: 250px;
            background: rgba(217, 38, 169, 0.08);
            bottom: 10%;
            right: 15%;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 24px;
            max-width: 410px;
            width: 100%;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 255, 204, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            border-color: rgba(0, 255, 204, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 35px var(--accent-glow);
        }

        .img-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .game-img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .container:hover .game-img {
            transform: scale(1.03);
        }

        .badge-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Chakra Petch', 'Noto Sans Khmer', sans-serif;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .notice-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .notice-box p {
            color: #fde68a;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            margin: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #00ffcc 0%, #00cc99 100%);
            color: #03120e;
            padding: 14px 24px;
            text-decoration: none;
            font-family: 'Chakra Petch', 'Noto Sans Khmer', sans-serif;
            font-weight: 700;
            font-size: 15px;
            border-radius: 14px;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.25s ease;
            touch-action: manipulation;
        }

        .btn:hover {
            background: linear-gradient(135deg, #26ffd5 0%, #00dfa7 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.55);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-icon {
            font-size: 17px;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="img-wrapper">
            <span class="badge-tag">Cloud Play</span>
            <img src="IMG_5209.jpeg" alt="GTA V Poster" class="game-img" decoding="async">
        </div>

        <h1>Grand Theft Auto V</h1>

        <div class="notice-box">
            <span>🎮</span>
            <p>តម្រូវ​ឱ្យភ្ជាប់ជាមួយ «ដៃហ្គេម/Controller» ទើបអាចលេងបាន!</p>
        </div>

        <a href="https://m.taptap.io/app/gta-5-grand-theft-auto-v-33805743" class="btn" target="_blank" rel="noopener noreferrer">
            <span class="btn-icon">⚡</span>
            <span>ចូលលេងលើ TapTap (Play Now)</span>
        </a>

        <div class="footer-note">
            Version 2.0 • TapTap Cloud Gaming
        </div>
    </main>

</body>
</html>
