<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V - TapTap</title>
    <style>
        body {
            font-family: 'Khmer OS Siemreap', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }
        .game-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 {
            color: #00ffcc;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #00ffcc;
            color: #121212;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #00b386;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="IMG_5209.jpeg" alt="GTA V Cover" class="game-img">
        <h1>Grand Theft Auto V</h1>
        <p>ចុចទីនេះដើម្បីចូល Play ហ្គេម GTAV តម្រូវ​ឱ្យត្រូវមាន​ ដៃហ្គេម</p>
        <a href="https://m.taptap.io/app/gta-5-grand-theft-auto-v-33805743" class="btn" target="_blank">Play Now</a>
    </div>

</body>
</html>
