<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Photo Editor - Mobile & PC</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { 
            margin-bottom: 15px; 
            color: #4CAF50; 
            text-align: center;
            font-size: 22px;
        }
        .container {
            display: flex;
            flex-direction: row;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            max-width: 900px;
            width: 100%;
            gap: 20px;
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .preview-area {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            min-height: 280px;
            position: relative;
            overflow: hidden;
        }
        canvas {
            max-width: 100%;
            max-height: 400px;
            border-radius: 4px;
            object-fit: contain;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 13px; color: #b0b0b0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4CAF50; }
        input[type="file"] { display: none; }
        
        .btn-container {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            display: block;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #45a049; }
        .btn-secondary { background-color: #008CBA; }
        .btn-secondary:hover { background-color: #007bb5; }
        .btn-danger { background-color: #f44336; }
        .btn-danger:hover { background-color: #d32f2f; }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 12px;
            }
            body {
                padding: 5px;
            }
        }
    </style>
</head>
<body>

    <h2>កម្មវិធីកាត់តរូបភាព (PC & Mobile)</h2>
    
    <div class="container">
        <div class="controls">
            <label for="upload" class="btn">📁 ជ្រើសរើសរូបភាពពីឧបករណ៍</label>
            <input type="file" id="upload" accept="image/*">

            <div class="control-group">
                <label>ពន្លឺ (Brightness): <span id="brightness-val">100</span>%</label>
                <input type="range" id="brightness" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label>កម្រិតពណ៌ច្បាស់ (Contrast): <span id="contrast-val">100</span>%</label>
                <input type="range" id="contrast" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label>តិត្ថិភាពពណ៌ (Saturation): <span id="saturation-val">100</span>%</label>
                <input type="range" id="saturation" min="0" max="200" value="100">
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" id="grayscale-btn">ស / ខ្មៅ</button>
                <button class="btn btn-danger" id="reset-btn">កំណត់ដើម</button>
            </div>

            <button class="btn" id="download-btn" style="background-color: #ff9800; margin-top: 5px;">⬇️ ទាញយក (Download)</button>
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
            <p id="placeholder-text" style="color: #777; text-align: center; font-size: 14px;">សូមចុច "ជ្រើសរើសរូបភាព" ដើម្បីចាប់ផ្តើម</p>
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder-text');

        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');
        const saturationInput = document.getElementById('saturation');
        
        const brightnessVal = document.getElementById('brightness-val');
        const contrastVal = document.getElementById('contrast-val');
        const saturationVal = document.getElementById('saturation-val');

        let img = new Image();
        let isImageLoaded = false;
        let isGrayscale = false;

        upload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    img.onload = function() {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        isImageLoaded = true;
                        placeholder.style.display = 'none';
                        applyFilters();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function applyFilters() {
            if (!isImageLoaded) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let brightness = brightnessInput.value;
            let contrast = contrastInput.value;
            let saturation = saturationInput.value;
            let gray = isGrayscale ? 'grayscale(100%)' : 'grayscale(0%)';

            ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) ${gray}`;
            ctx.drawImage(img, 0, 0);

            brightnessVal.innerText = brightness;
            contrastVal.innerText = contrast;
            saturationVal.innerText = saturation;
        }

        ['input', 'change'].forEach(evt => {
            brightnessInput.addEventListener(evt, applyFilters);
            contrastInput.addEventListener(evt, applyFilters);
            saturationInput.addEventListener(evt, applyFilters);
        });

        document.getElementById('grayscale-btn').addEventListener('click', () => {
            isGrayscale = !isGrayscale;
            applyFilters();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            brightnessInput.value = 100;
            contrastInput.value = 100;
            saturationInput.value = 100;
            isGrayscale = false;
            applyFilters();
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            if (!isImageLoaded) {
                alert('សូមជ្រើសរើសរូបភាពជាមុនសិន!');
                return;
            }
            const link = document.createElement('a');
            link.download = 'edited-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
