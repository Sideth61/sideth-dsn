<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN HACKER TERMINAL & AUDIO — Sideth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Kantumruy+Pro:wght@400;700&display=swap');

        :root {
            --matrix-green: #00ff66;
            --matrix-dark: #050b05;
            --terminal-bg: rgba(5, 11, 5, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--matrix-dark);
            color: var(--matrix-green);
            font-family: 'Share Tech Mono', 'Kantumruy Pro', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 700px;
            background: var(--terminal-bg);
            border: 2px solid var(--matrix-green);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.4), inset 0 0 15px rgba(0, 255, 102, 0.2);
            backdrop-filter: blur(10px);
            overflow: hidden;
            margin: 20px 0;
        }

        .terminal-header {
            background: rgba(0, 255, 102, 0.15);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--matrix-green);
            font-size: 14px;
        }

        .terminal-buttons {
            display: flex;
            gap: 8px;
        }

        .t-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .t-red { background: #ff5f56; }
        .t-yellow { background: #ffbd2e; }
        .t-green { background: #27c93f; }

        .terminal-body {
            padding: 20px;
            max-height: 480px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
        }

        .terminal-body::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: var(--matrix-green);
            border-radius: 3px;
        }

        .output-text {
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .highlight {
            color: #fff;
            text-shadow: 0 0 8px var(--matrix-green);
            font-weight: bold;
        }

        /* Progress Bar Styles */
        .progress-container {
            width: 100%;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--matrix-green);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
            height: 22px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--matrix-green);
            box-shadow: 0 0 10px var(--matrix-green);
            transition: width 0.1s linear;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #000;
            mix-blend-mode: difference;
        }

        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .prompt-symbol {
            color: var(--matrix-green);
            font-weight: bold;
        }

        .command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            width: 100%;
            caret-color: var(--matrix-green);
        }

        .action-btns {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .hack-btn {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .hack-btn:hover {
            background: var(--matrix-green);
            color: #000;
            box-shadow: 0 0 15px var(--matrix-green);
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="t-btn t-red"></span>
                <span class="t-btn t-yellow"></span>
                <span class="t-btn t-green"></span>
            </div>
            <span>root@dsn-os-2026:~# sideth</span>
            <span>🔒 SECURE</span>
        </div>
        <div class="terminal-body" id="terminalBody">
            <div class="output-text">
                Initializing DSN OS v2026 (Hacker Edition)...<br>
                Welcome back, <span class="highlight">Sideth</span> (Supreme Code King)[span_1](start_span)[span_1](end_span).<br>
                Type <span class="highlight">'help'</span> or use buttons below to execute commands.
            </div>
            <div id="commandHistory"></div>
            
            <div class="input-line">
                <span class="prompt-symbol">root@sideth:~$</span>
                <input type="text" id="userInput" class="command-input" autofocus autocomplete="off">
            </div>

            <div class="action-btns">
                <button class="hack-btn" onclick="runCommand('status')">[1] SYSTEM STATUS</button>
                <button class="hack-btn" onclick="runCommand('bypass')">[2] BYPASS FIREWALL</button>
                <button class="hack-btn" onclick="runCommand('matrix')">[3] MATRIX OVERLOAD</button>
                <button class="hack-btn" onclick="runCommand('audio')">[4] HACKER AUDIO</button>
                <button class="hack-btn" onclick="runCommand('clear')" style="grid-column: span 2;">[5] CLEAR TERMINAL</button>
            </div>
        </div>
    </div>

    <script>
        // Matrix Rain Background Effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 11, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // Hacker Sound Generator
        function playHackerSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                setTimeout(() => { playTone(audioCtx, 1200, 0.08); }, 0);
                setTimeout(() => { playTone(audioCtx, 800, 0.08); }, 100);
                setTimeout(() => { playTone(audioCtx, 2400, 0.25); }, 250);
            } catch(e) {
                console.log("Audio not supported");
            }
        }

        function playTone(ctx, freq, duration) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + duration);
        }

        // Terminal Logic & Progress Bar Handler
        const userInput = document.getElementById('userInput');
        const commandHistory = document.getElementById('commandHistory');
        const terminalBody = document.getElementById('terminalBody');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                let cmd = userInput.value.trim().toLowerCase();
                runCommand(cmd);
                userInput.value = '';
            }
        });

        function runCommand(cmd) {
            playHackerSound();
            let pTag = document.createElement('div');
            pTag.className = 'output-text';
            pTag.innerHTML = `<span style="color:#00ff66;">root@sideth:~$</span> ${cmd}`;
            commandHistory.appendChild(pTag);

            let resTag = document.createElement('div');
            resTag.className = 'output-text';

            if (cmd === 'status') {
                resTag.innerHTML = `[+] Owner: <span class="highlight">Sideth</span><br>[+] Website: sideth.site (ONLINE)[span_2](start_span)[span_2](end_span)<br>[+] Security Level: GOD-TIER SECURE`;
                commandHistory.appendChild(resTag);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            } else if (cmd === 'bypass') {
                resTag.innerHTML = `[⚡] Bypassing mainframe security...`;
                commandHistory.appendChild(resTag);
                
                // Add Progress Bar
                let pbWrapper = document.createElement('div');
                pbWrapper.innerHTML = `
                    <div class="progress-container">
                        <div class="progress-bar" id="pBar"></div>
                        <div class="progress-text" id="pText">0%</div>
                    </div>
                `;
                commandHistory.appendChild(pbWrapper);
                terminalBody.scrollTop = terminalBody.scrollHeight;

                let progress = 0;
                let bar = pbWrapper.querySelector('#pBar');
                let text = pbWrapper.querySelector('#pText');
                
                let interval = setInterval(() => {
                    progress += 2;
                    if (progress <= 100) {
                        bar.style.width = progress + '%';
                        text.innerText = progress + '%';
                    } else {
                        clearInterval(interval);
                        let successTag = document.createElement('div');
                        successTag.className = 'output-text';
                        successTag.innerHTML = `<span class="highlight">[✔] Access granted to DSN Core Database successfully!</span>`;
                        commandHistory.appendChild(successTag);
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                    }
                }, 30);

            } else if (cmd === 'matrix') {
                resTag.innerHTML = `[🌐] Matrix density increased. Welcome to the digital realm, Code King.`;
                commandHistory.appendChild(resTag);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            } else if (cmd === 'audio') {
                resTag.innerHTML = `[🔊] Hacker audio sound effect played successfully!`;
                commandHistory.appendChild(resTag);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            } else if (cmd === 'clear') {
                commandHistory.innerHTML = '';
            } else if (cmd === 'help') {
                resTag.innerHTML = `Available Commands: <br>- status<br>- bypass (Loads Progress Bar)<br>- matrix<br>- audio<br>- clear`;
                commandHistory.appendChild(resTag);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            } else {
                resTag.innerHTML = `Command not recognized: '${cmd}'. Type 'help' for options.`;
                commandHistory.appendChild(resTag);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }
        }
    </script>
</body>
</html>
