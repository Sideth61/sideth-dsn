<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DsnSuno Pro - Lyrics & DistroKid Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Preahvihear&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>🎵 DsnSuno Pro Manager</h1>
        <button onclick="clearAllData()" class="btn-action" style="background: #ef4444;">🗑️ សម្អាតទិន្នន័យ</button>
    </div>

    <div class="creator-box">
        <span style="font-size: 13px; font-weight: bold; color: #ec4899;">📝 កត់ត្រាទំនុកច្រៀង និង DistroKid Planner</span>
        
        <input type="text" id="songTitleInput" placeholder="ចំណងជើងបទចម្រៀង (ឧ. បងស្រឡាញ់តែអូន)..." />
        
        <input type="text" id="artistInput" placeholder="ឈ្មោះសិល្បករ/Artist (ឧ. Sideth / Deth DSN)..." />
        
        <input type="text" id="styleInput" placeholder="រចនាប័ទ្មតន្ត្រី/Music Style (ឧ. Khmer Romantic Pop)..." />

        <textarea id="lyricsInput" placeholder="សរសេរ ឬរក្សាទុក Lyrics ទំនុកច្រៀងរបស់អ្នកទីនេះ..."></textarea>

        <div style="display: flex; gap: 8px;">
            <button class="btn-gen" onclick="saveSongProject()" style="flex: 1; background: linear-gradient(135deg, #3b82f6, #1d4ed8);">💾 រក្សាទុកទុក</button>
            <button class="btn-gen" onclick="exportDistroKidMeta()" style="flex: 1; background: linear-gradient(135deg, #ec4899, #8b5cf6);">📦 ထုတ် DistroKid File</button>
        </div>
    </div>

    <div class="creator-box" style="margin-top: 10px;">
        <span style="font-size: 13px; font-weight: bold; color: #34d399;">📂 បញ្ជីបទចម្រៀងដែលបានរក្សាទុក (Saved Projects)</span>
        <div id="savedSongsList" style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px; max-height: 250px; overflow-y: auto;">
            <!-- បញ្ជីនឹងបង្ហាញទីនេះដោយស្វ័យប្រវត្តិ -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
