<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suno Clone - Deth DSN</title>
    <style>
        :root {
            --bg-color: #0e0e10;
            --card-bg: #18181b;
            --accent-color: #ff5722;
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 896px;
            background-color: var(--bg-color);
            border: 4px solid var(--border-color);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .upgrade-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 80px 20px;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            padding: 20px;
            border-radius: 16px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        .profile-info h2 {
            font-size: 18px;
            color: #fff;
        }

        .profile-info p {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        /* Song Item */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .song-item {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .song-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background-color: #333;
            object-fit: cover;
        }

        .song-meta h4 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .song-meta span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .badge {
            background-color: #e91e63;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        /* Navigation Bar */
        .navbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .create-fab {
            background-color: var(--accent-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">SUNO</div>
            <div class="header-icons">
                <button class="upgrade-btn">Upgrade</button>
                <span>🔍</span>
                <span>🔔</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Profile Card -->
            <div class="profile-section">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar" class="avatar">
                <div class="profile-info">
                    <h2>Deth DSN</h2>
                    <p>@sansideth61 • 75 plays</p>
                </div>
            </div>

            <div class="section-title">Songs &gt;</div>

            <!-- Songs List -->
            <div class="song-list">
                <div class="song-item">
                    <div class="song-details">
                        <div class="song-thumb" style="background: linear-gradient(45deg, #2c3e50, #4ca1af);"></div>
                        <div class="song-meta">
                            <h4>ទាហានម៉ប៊ី <span class="badge">v5.5</span></h4>
                            <span>▶ 9 • Khmer Pop</span>
                        </div>
                    </div>
                    <span>⋮</span>
                </div>

                <div class="song-item">
                    <div class="song-details">
                        <div class="song-thumb" style="background: linear-gradient(45deg, #1f4037, #99f2c8);"></div>
                        <div class="song-meta">
                            <h4>ព្រះច័ន្ទលើដី <span class="badge">v5.5</span></h4>
                            <span>▶ 14 • Khmer Pop</span>
                        </div>
                    </div>
                    <span>⋮</span>
                </div>

                <div class="song-item">
                    <div class="song-details">
                        <div class="song-thumb" style="background: linear-gradient(45deg, #833ab4, #fd1d1d);"></div>
                        <div class="song-meta">
                            <h4>MMO ពេញ្ញភូមិ <span class="badge">v5.5</span></h4>
                            <span>▶ 12</span>
                        </div>
                    </div>
                    <span>⋮</span>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="navbar">
            <button class="nav-item">🏠</button>
            <button class="nav-item">🧭</button>
            <button class="create-fab">♫</button>
            <button class="nav-item">📊</button>
            <button class="nav-item">👤</button>
        </div>
    </div>

</body>
</html>
