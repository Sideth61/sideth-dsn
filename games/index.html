<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030007">
<meta name="description" content="DSN PS2 និង PSP Local File Player">
<title>PS2PSP Local - Sideth Version 1.6 Offline</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo_psp.jpg">
<link rel="icon" type="image/jpeg" href="logo_psp.jpg">
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --bg-deep:#030007;
  --text:#fff;
  --focus:#fde68a;
  --success-start:rgba(5,150,105,.78);
  --success-end:rgba(4,120,87,.88);
  --pink-start:rgba(219,39,119,.78);
  --pink-end:rgba(157,23,77,.88);
  --danger-start:rgba(220,38,38,.82);
  --danger-end:rgba(153,27,27,.9);
  --blue-start:rgba(37,99,235,.82);
  --blue-end:rgba(29,78,216,.9);
}
html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;
  font-family:"Noto Sans Khmer","Khmer OS","Leelawadee UI",Arial,sans-serif;
  color:var(--text);
  overflow-x:hidden;
  background:var(--bg-deep);
}
body{
  padding-bottom:env(safe-area-inset-bottom);
}
.fixed-bg{
  position:fixed;
  inset:0;
  z-index:-999;
  background:url("icon4.jpg") center/cover no-repeat;
}
.fixed-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(3,0,7,.48);
}
.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:clamp(16px,4vw,24px) 12px;
  display:flex;
  flex-direction:column;
  gap:18px;
  position:relative;
  z-index:1;
}
.card{
  padding:clamp(16px,4vw,20px);
  overflow:hidden;
  position:relative;
  border:1px solid rgba(255,255,255,.25);
  border-radius:28px;
  background:rgba(255,255,255,.06);
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.banner-img{
  display:block;
  width:100%;
  height:clamp(150px,35vw,180px);
  object-fit:cover;
  margin-bottom:15px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:18px;
  background:#12091b;
}
.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.2);
  color:#fff;
  font-size:clamp(17px,4.5vw,18px);
  font-weight:700;
}
p{
  margin:0 0 12px;
  color:#f8fafc;
  font-size:14px;
  line-height:1.7;
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-height:52px;
  margin-top:9px;
  padding:13px 14px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:16px;
  color:#fff;
  text-align:center;
  text-decoration:none;
  font:700 14px/1.45 inherit;
  cursor:pointer;
  transition:transform .2s ease,background .2s ease,opacity .2s ease,box-shadow .2s ease;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  touch-action:manipulation;
}
.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.2);
}
.btn:active{
  transform:scale(.98);
}
.btn:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(253,230,138,.22);
}
.btn:disabled{
  cursor:not-allowed;
  opacity:.72;
  transform:none;
}
.status{
  min-height:22px;
  margin:10px 0 0;
  color:#fef3c7;
  font-size:12px;
  line-height:1.5;
}
.toast{
  position:fixed;
  z-index:2000;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:max-content;
  max-width:min(90vw,520px);
  padding:12px 18px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:16px;
  background:rgba(20,10,30,.92);
  color:#fff;
  font-size:13px;
  line-height:1.5;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,20px);
  transition:opacity .3s ease,transform .3s ease;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
.version{
  margin-top:-8px;
  color:rgba(255,255,255,.72);
  font-size:11px;
  text-align:center;
}
.offline-badge{
  position:fixed;
  top:10px;
  right:10px;
  z-index:1500;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  background:rgba(5,150,105,.82);
  color:#fff;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transform:translateY(-8px);
  transition:opacity .25s ease,transform .25s ease;
}
.offline-badge.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>
<body>
<div class="fixed-bg" aria-hidden="true"></div>
<div id="offlineBadge" class="offline-badge" role="status" aria-live="polite"></div>
<main class="container" aria-labelledby="pageTitle">
  <h1 id="pageTitle" class="section-title" hidden>
    DSN PS2 និង PSP Local File Player
  </h1>
  <section class="card" aria-labelledby="ps2Title">
    <img src="ps2.JPEG" alt="រូបភាពបណ្ណាល័យហ្គេម PS2" class="banner-img" decoding="async">
    <h2 id="ps2Title" class="section-title">🎮 DSN PS2 Local File Player</h2>
    <p id="ps2Description">
      Welcome back, San Sidet ❤️️🌺 😘<br>
      លេងហ្គេម PS2 ផ្ទាល់ពីក្នុងទូរស័ព្ទ លឿនរហ័ស មិនបាច់ពឹង Server ក្រៅ 🔥
    </p>
    <button id="localPs2Btn" class="btn" type="button" style="background:linear-gradient(135deg,var(--success-start),var(--success-end));">
      <span class="btn-label">📂 បើកហ្គេម PS2 ផ្ទាល់ពីទូរស័ព្ទ (ISO, ZIP, CHD)</span>
    </button>
    <input id="localPs2Input" type="file" accept=".iso,.bin,.cue,.chd,.cso,.zip" hidden>
    <p id="ps2Status" class="status" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="pspTitle">
    <img src="psp.jpg" alt="រូបភាពបណ្ណាល័យហ្គេម PSP" class="banner-img" decoding="async">
    <h2 id="pspTitle" class="section-title">🎯 DSN PSP Local File Player</h2>
    <p id="pspDescription">
      លេងហ្គេម PSP ផ្ទាល់ពីក្នុងទូរស័ព្ទ អត់មានរឿង Error ទៀតទេ 🚀
    </p>
    <button id="localPspBtn" class="btn" type="button" style="background:linear-gradient(135deg,var(--pink-start),var(--pink-end));">
      <span class="btn-label">📂 បើកហ្គេម PSP ផ្ទាល់ពីទូរស័ព្ទ (ISO, CSO, ZIP)</span>
    </button>
    <input id="localPspInput" type="file" accept=".iso,.cso,.zip" hidden>
    <p id="pspStatus" class="status" role="status" aria-live="polite"></p>
  </section>

  <div class="version">DSN PS2PSP Local • Version 1.6 Offline</div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const CONFIG = {
  systems: {
    ps2: { button: "localPs2Btn", input: "localPs2Input", status: "ps2Status" },
    psp: { button: "localPspBtn", input: "localPspInput", status: "pspStatus" }
  }
};
const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = $("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

async function handleLocalFile(file, system) {
  if (!file) return;
  showToast(`⏳ កំពុងរៀបចំ File: ${file.name}...`);
  try {
    const blobUrl = URL.createObjectURL(file);
    showToast("🔥 ត្រៀមលក្ខណៈរួចរាល់! កំពុងបើក Emulator...");
    setTimeout(() => {
      window.location.href = `emulator.html?title=${encodeURIComponent(file.name)}&system=${system}&rom=${encodeURIComponent(blobUrl)}`;
    }, 800);
  } catch (err) {
    showToast(`❌ កំហុសឆ្គង: ${err.message}`);
  }
}

function init() {
  ["ps2", "psp"].forEach(sys => {
    const cfg = CONFIG.systems[sys];
    $(cfg.button)?.addEventListener("click", () => $(cfg.input)?.click());
    $(cfg.input)?.addEventListener("change", e => handleLocalFile(e.target.files[0], sys));
  });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
