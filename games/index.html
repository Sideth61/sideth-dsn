<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Games Hub - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        body {
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 22px;
            color: #10b981;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
            margin-bottom: 5px;
        }
        header p {
            font-size: 13px;
            color: #94a3b8;
        }
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .game-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 14px;
            padding: 16px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .game-card:hover {
            background: #10b981;
            color: #0f172a;
            border-color: #10b981;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        .game-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .game-icon {
            font-size: 28px;
        }
        .game-title {
            font-size: 15px;
            font-weight: 600;
        }
        .game-desc {
            font-size: 11px;
            color: #94a3b8;
        }
        .game-card:hover .game-desc {
            color: #0f172a;
        }
        .arrow {
            font-size: 18px;
            font-weight: bold;
        }
        .back-home {
            display: block;
            text-align: center;
            background: #1e293b;
            color: #38bdf8;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: 0.3s;
        }
        .back-home:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🕹️ ALL GAMES FOLDER</h1>
            <p>បណ្តុំហ្គេមសប្បាយៗសម្រាប់ Sideth❤️️</p>
        </header>

        <div class="games-list">
            <!-- Link ไปកាន់ file game.html ដែលជាហ្គេមหลัก -->
            <a href="game.html" class="game-card">
                <div class="game-info">
                    <span class="game-icon">⭐</span>
                    <div>
                        <div class="game-title">DSN Ultimate Game Hub</div>
                        <div class="game-desc">ប្រព័ន្ធហ្គេមចម្បង និង Mini Games</div>
                    </div>
                </div>
                <div class="arrow">➔</div>
            </a>

            <a href="#" onclick="alert('ហ្គេមនេះនឹងមកដល់ឆាប់ៗ!')" class="game-card">
                <div class="game-info">
                    <span class="game-icon">🐍</span>
                    <div>
                        <div class="game-title">Snake Classic 3D</div>
                        <div class="game-desc">ហ្គេមពស់ស៊ីចំណីបែបទំនើប</div>
                    </div>
                </div>
                <div class="arrow">➔</div>
            </a>

            <a href="#" onclick="alert('ហ្គេមនេះនឹងមកដល់ឆាប់ៗ!')" class="game-card">
                <div class="game-info">
                    <span class="game-icon">🏎️</span>
                    <div>
                        <div class="game-title">Neon Racing</div>
                        <div class="game-desc">បរឡានប្រណិតគេចឧបសគ្គ</div>
                    </div>
                </div>
                <div class="arrow">➔</div>
            </a>
        </div>

        <a href="../index.html" class="back-home">🏠 ត្រឡប់ទៅទំព័រដើម (Home)</a>
    </div>

</body>
</html>
