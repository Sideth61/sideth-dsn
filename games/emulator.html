<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030007">
<title>DSN Local ISO Player • Sideth Version</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100vh;
  background:#030007; color:#fff;
  font-family:"Noto Sans Khmer",sans-serif;
  overflow:hidden; display:flex; flex-direction:column;
}
.header{
  padding:12px 16px; background:rgba(20,10,30,0.95);
  border-bottom:1px solid rgba(255,255,255,0.15);
  display:flex; align-items:center; justify-content:space-between;
  z-index:10;
}
.title{font-size:13px; font-weight:700; color:#fde68a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.back-btn{
  padding:6px 14px; border:1px solid rgba(255,255,255,0.3);
  border-radius:10px; background:rgba(255,255,255,0.1); color:#fff;
  font-size:12px; text-decoration:none; cursor:pointer;
}
.player-container{
  flex:1; width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; background:#000;
}
.center-box{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:20px; text-align:center; z-index:5; width:100%; max-width:400px;
}
.btn-action{
  background:linear-gradient(135deg, #db2777, #9d174d);
  color:#fff; padding:14px 24px; border-radius:16px;
  font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:0 6px 20px rgba(219,39,119,0.4);
  border:1px solid rgba(255,255,255,0.3); text-decoration:none; display:block; width:100%;
}
.info-text{font-size:13px; color:#fef3c7; line-height:1.6;}
</style>
</head>
<body>

<div class="header">
  <div id="gameTitle" class="title">🎮 DSN ISO Player</div>
  <a href="index.html" class="back-btn">⬅️ ត្រឡប់ក្រោយ</a>
</div>

<div class="player-container">
  <div id="centerBox" class="center-box">
    <div style="font-size:45px;">🎯</div>
    <div id="statusText" class="info-text">កំពុងត្រៀមរៀបចំ File ហ្គេមសម្រាប់ B Sideth❤️️...</div>
    <div id="actionArea" style="width:100%;"></div>
  </div>
</div>

<script>
"use strict";
const params = new URLSearchParams(window.location.search);
const title = params.get("title") || "Game ISO";
const romUrl = params.get("rom");

document.getElementById("gameTitle",).textContent = `🎮 ${title}`;
const statusText = document.getElementById("statusText");
const actionArea = document.getElementById("actionArea");

if (!romUrl) {
  statusText.textContent = "❌ រកមិនឃើញ File ហ្គេមទេ!";
  actionArea.innerHTML = `<a href="index.html" class="btn-action">ត្រឡប់ទៅទំព័រដើម</a>`;
} else {
  // បង្ហាញប៊ូតុងផ្ដល់ជម្រើសឱ្យបង Download រួចបើកចូល App Emulator ក្នុងទូរសព្ទផ្ទាល់ ឬលេងកម្សាន្ត
  statusText.innerHTML = `✅ File ហ្គេមត្រូវបានអានរួចរាល់!<br><b style="color:#38bdf8;">${title}</b>`;
  actionArea.innerHTML = `
    <a href="${romUrl}" download="${title}" class="btn-action" style="background:linear-gradient(135deg,#2563eb,#1d4ed8);">📥 ទាញយក File ទុកក្នុងទូរសព្ទ</a>
    <a href="index.html" class="btn-action" style="margin-top:10px; background:rgba(255,255,255,0.1);">⬅️ រើសហ្គេមផ្សេងទៀត</a>
  `;
}
</script>

</body>
</html>
