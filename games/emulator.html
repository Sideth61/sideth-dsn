<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030007">
<title>DSN Game Player • Sideth Version</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100vh;
  background:#030007; color:#fff;
  font-family:"Noto Sans Khmer",sans-serif;
  overflow:hidden;
  display:flex; flex-direction:column;
}
.header{
  padding:12px 16px;
  background:rgba(20,10,30,0.9);
  border-bottom:1px solid rgba(255,255,255,0.15);
  display:flex; align-items:center; justify-content:space-between;
  z-index:10;
}
.title{font-size:14px; font-weight:700; color:#fde68a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.back-btn{
  padding:6px 14px; border:1px solid rgba(255,255,255,0.3);
  border-radius:10px; background:rgba(255,255,255,0.1); color:#fff;
  font-size:12px; text-decoration:none; cursor:pointer;
}
.player-container{
  flex:1; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  position:relative; background:#000;
}
#gameFrame{
  width:100%; height:100%; border:none; outline:none;
}
.loading{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:#030007;
  z-index:5; gap:12px; font-size:14px; color:#fef3c7;
}
.spinner{
  width:40px; height:40px; border:4px solid rgba(255,255,255,0.2);
  border-top-color:#fde68a; border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="header">
  <div id="gameTitle" class="title">🎮 កំពុងផ្ទុកហ្គេម...</div>
  <a href="index.html" class="back-btn">⬅️ ត្រឡប់ក្រោយ</a>
</div>

<div class="player-container">
  <div id="loadingBox" class="loading">
    <div class="spinner"></div>
    <div>កំពុងរៀបចំ Emulator និង File ហ្គេមជូន B Sideth❤️️...</div>
  </div>
  <!-- ផ្នែកបង្ហាញ Emulator Web Player (អាចកែសម្រួល URL Core តាមតម្រូវការ) -->
  <iframe id="gameFrame" allowfullscreen></iframe>
</div>

<script>
"use strict";
const params = new URLSearchParams(window.location.search);
const title = params.get("title") || "Game Player";
const system = params.get("system") || "psp";
const romUrl = params.get("rom");

document.getElementById("gameTitle").textContent = `🎮 ${title} (${system.toUpperCase()})`;

const iframe = document.getElementById("gameFrame");
const loadingBox = document.getElementById("loadingBox");

if (romUrl) {
  // ភ្ជាប់ទៅកាន់ Emulator Web Core ស្របតាម System (PS2 ឬ PSP)
  // ဥទាហរណ៍៖ ប្រើប្រាស់ Online/Offline Core Emulator សម្រាប់ WebAssembly
  if (system === "psp") {
    // អាចដាក់ Emulator URL របស់ PSP Web (ឧទាហរណ៍ PPSSPP Web ឬ Custom URL)
    iframe.src = `https://bin.sisupport.org/?rom=${encodeURIComponent(romUrl)}`; // ជំនួស URL Emulator តាមចង់បាន
  } else {
    iframe.src = `https://bin.sisupport.org/?rom=${encodeURIComponent(romUrl)}`;
  }

  iframe.onload = () => {
    loadingBox.style.display = "none";
  };
} else {
  loadingBox.innerHTML = "❌ រកមិនឃើញ File ហ្គេមទេ!<br><a href='index.html' class='back-btn' style='margin-top:10px;'>ត្រឡប់ទៅវិញ</a>";
}
</script>

</body>
</html>
