<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030007">
<title>DSN PSP Emulator • Sideth Version</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100vh;
  background:#030007; color:#fff;
  font-family:"Noto Sans Khmer",sans-serif;
  overflow:hidden; display:flex; flex-direction:column;
}
.header{
  padding:10px 16px; background:rgba(20,10,30,0.95);
  border-bottom:1px solid rgba(255,255,255,0.15);
  display:flex; align-items:center; justify-content:space-between;
  z-index:10;
}
.title{font-size:13px; font-weight:700; color:#fde68a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.back-btn{
  padding:5px 12px; border:1px solid rgba(255,255,255,0.3);
  border-radius:8px; background:rgba(255,255,255,0.1); color:#fff;
  font-size:12px; text-decoration:none; cursor:pointer;
}
.player-box{
  flex:1; width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; background:#000;
}
#emulatorCanvas{
  width:100%; height:100%; object-fit:contain; background:#000; outline:none;
}
.loading{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:#030007;
  z-index:5; gap:12px; font-size:14px; color:#fef3c7; text-align:center; padding:20px;
}
.spinner{
  width:40px; height:40px; border:4px solid rgba(255,255,255,0.2);
  border-top-color:#fde68a; border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="header">
  <div id="gameTitle" class="title">🎮 PSP Emulator กำลังโหลด...</div>
  <a href="index.html" class="back-btn">⬅️ ត្រឡប់ក្រោយ</a>
</div>

<div class="player-box">
  <div id="loadingBox" class="loading">
    <div class="spinner"></div>
    <div id="loadingText">កំពុងរៀបចំ Emulator និងទាញយក File ហ្គេមជូន B Sideth❤️️...</div>
  </div>
  <!-- Canvas សម្រាប់ Emulator Render ហ្គេម PSP -->
  <canvas id="emulatorCanvas"></canvas>
</div>

<script>
"use strict";
const params = new URLSearchParams(window.location.search);
const title = params.get("title") || "PSP Game";
const romUrl = params.get("rom");

document.getElementById("gameTitle").textContent = `🎮 ${title}`;
const loadingBox = document.getElementById("loadingBox");
const loadingText = document.getElementById("loadingText");

async function loadAndRunGame() {
  if (!romUrl) {
    loadingBox.innerHTML = `❌ រកមិនឃើញ File ហ្គេមទេ!<br><a href="index.html" class="back-btn" style="margin-top:10px;display:inline-block;">ត្រឡប់ទៅវិញ</a>`;
    return;
  }

  try {
    loadingText.textContent = "កំពុងទាញយក File ហ្គេមចូលទូរសព្ទ... (អាស្រ័យលើទំហំ File)";
    
    // ទាញយក File ហ្គេមតាម URL Object
    const response = await fetch(romUrl);
    if (!response.ok) throw new Error("មិនអាចទាញយក File ហ្គេមបានទេ");
    
    const blob = await response.blob();
    const gameBlobUrl = URL.createObjectURL(blob);

    loadingText.textContent = "កំពុងចាប់ផ្ដើម PSP Core Emulator... 🚀";

    // ជំនួសតំណរភ្ជាប់ទៅកាន់ WebPlayer Emulator ដ៏មានស្ថេរភាព ឬ Local Emulator Frame
    // បងអាចដាក់ URL Web Emulator របស់ PPSSPP ដែលដំណើរការស្រាប់
    const emulatorEmbedUrl = `https://emulatorjs.com/play?system=psp&rom=${encodeURIComponent(gameBlobUrl)}`;
    
    // បង្កើត Iframe បញ្ចូល EmulatorJS ជំនួស Canvas ប្រសិនបើចង់បានភាពងាយស្រួលនិងមិនរអាក់រអួល
    const iframe = document.createElement("iframe");
    iframe.src = emulatorEmbedUrl;
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.style.position = "absolute";
    iframe.style.inset = "0";
    
    document.querySelector(".player-box").appendChild(iframe);
    loadingBox.style.display = "none";

  } catch (err) {
    console.error(err);
    loadingBox.innerHTML = `⚠️ មានបញ្ហាក្នុងការផ្ទុកហ្គេម៖ ${err.message}<br><a href="index.html" class="back-btn" style="margin-top:10px;display:inline-block;">សាកល្បងម្ដងទៀត</a>`;
  }
}

loadAndRunGame();
</script>

</body>
</html>
