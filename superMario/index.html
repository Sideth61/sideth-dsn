<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario - Sideth Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #ec4899;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
        }
        h1 { font-size: 20px; color: #f43f5e; margin-bottom: 5px; text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
        p.sub { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
        .game-screen {
            background: #000;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .mario-icon { font-size: 50px; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
        .game-msg { margin-top: 10px; font-size: 13px; color: #38bdf8; padding: 0 10px; }
        .btn-play {
            background: #ec4899;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
            margin-top: 10px;
        }
        .btn-play:hover { background: #db2777; transform: translateY(-2px); }
        .back-link { display: block; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 12px; transition: 0.3s; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍄 SUPER MARIO WORLD</h1>
        <p class="sub">ហ្គេមបុរាណទាញយកពី GitHub សម្រាប់ Sideth❤️️</p>

        <div class="game-screen" id="screenBox">
            <div class="mario-icon">🍄</div>
            <div class="game-msg" id="msgText">ត្រៀមខ្លួនទាញយកហ្គេម Mario ពី GitHub ហើយឬยัง?</div>
        </div>

        <button class="btn-play" onclick="downloadAndPlayMario()">🚀 ទាញយកនិងលេងពី GitHub</button>
        <a href="../../pages/game.html" class="back-link">⬅️ ត្រឡប់ទៅ All Games Hub</a>
    </div>

    <!-- JSZip Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        async function downloadAndPlayMario() {
            const msg = document.getElementById('msgText');
            const screen = document.getElementById('screenBox');
            
            // ផ្លាស់ប្ដូរ URL ខាងក្រោមទៅជា Raw Link របស់ file ក្នុង GitHub របស់បង
            const githubZipUrl = 'https://raw.githubusercontent.com/ឈ្មោះគណនីបង/ชื่อ Repository/main/superMario/Mario_NES_Gamepad_Supported.zip';

            msg.innerHTML = "⏳ កំពុងទាញយក File ពី GitHub ជូន Sideth...";
            
            try {
                const response = await fetch(githubZipUrl);
                if (!response.ok) throw new Error("រកមិនឃើញ File លើ GitHub ទេ!");
                
                const blob = await response.blob();
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(blob);
                
                const fileNames = Object.keys(zipContent.files);
                msg.innerHTML = `⭐ ជោគជ័យ! File ក្នុង GitHub Zip: <b>${fileNames[0]}</b> 🎮🔥`;
                screen.style.borderColor = "#10b981";
                
            } catch (error) {
                msg.innerHTML = `⚠️ កំហុស: ${error.message}. សូមពិនិត្យ Link GitHub ឡើងវិញ!`;
                screen.style.borderColor = "#f43f5e";
            }
        }
    </script>

</body>
</html>
