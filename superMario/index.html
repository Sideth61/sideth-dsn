<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario - Sideth Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1b4b, #311042);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #ec4899;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
        }
        h1 {
            font-size: 20px;
            color: #f43f5e;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }
        p.sub {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .game-screen {
            background: #000;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .mario-icon {
            font-size: 50px;
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        .game-msg {
            margin-top: 10px;
            font-size: 14px;
            color: #38bdf8;
        }
        .btn-play {
            background: #ec4899;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }
        .btn-play:hover {
            background: #db2777;
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍄 SUPER MARIO WORLD</h1>
        <p class="sub">ហ្គេមបុរាណសប្បាយៗសម្រាប់ Sideth❤️️</p>

        <div class="game-screen" id="screenBox">
            <div class="mario-icon">🍄</div>
            <div class="game-msg" id="msgText">ចុចប៊ូតុង "លេងហ្គេមឥឡូវនេះ" ដើម្បីចាប់ផ្ដើម!</div>
        </div>

        <button class="btn-play" onclick="startMarioGame()">🎮 លេងហ្គេមឥឡូវនេះ</button>
        <a href="../games/game.html" class="back-link">⬅️ ត្រឡប់ទៅ All Games Hub</a>
    </div>

    <script>
        function startMarioGame() {
            const msg = document.getElementById('msgText');
            const screen = document.getElementById('screenBox');
            msg.innerHTML = "🚀 កំពុង ਲੋດ World 1-1 ជូន Sideth... ត្រៀមលោត!";
            screen.style.borderColor = "#10b981";
            
            setTimeout(() => {
                msg.innerHTML = "⭐ ហ្គេម Super Mario កំពុងដំណើរការលើទូរសព្ទដៃយ៉ាងរលូន! 🍄🔥";
            }, 1200);
        }
    </script>

</body>
</html>
