<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario NES - Sideth Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .wrap {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { font-size: 16px; color: #f43f5e; margin-bottom: 10px; }
        .game-box {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #475569;
            margin-bottom: 12px;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .btn {
            background: #ec4899;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .back { display: block; margin-top: 10px; color: #94a3b8; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

    <div class="wrap">
        <h1>🍄 Super Mario NES Emulator</h1>
        
        <div class="game-box" id="screen">
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8; font-size: 13px;">
                ចុចប៊ូតុងខាងក្រោមដើម្បីចាប់ផ្ដើមលេង!
            </div>
        </div>

        <button class="btn" onclick="playMario()">🎮 ចាប់ផ្តើមលេង Mario</button>
        <a href="../../" class="back">⬅️ ត្រឡប់ក្រោយ</a>
    </div>

    <script>
        function playMario() {
            const screen = document.getElementById('screen');
            // Link ទៅកាន់ File ហ្គេម NES ផ្ទាល់នៅលើ GitHub របស់បង
            const romUrl = encodeURIComponent('https://raw.githubusercontent.com/Sideth61/sideth-dsn/main/superMario/Mario_NES_Gamepad/Mario.nes');
            
            // ប្រើ EmulatorJS ដើម្បីរត់ហ្គេមលើ iPhone យ៉ាងរលូន
            screen.innerHTML = `<iframe src="https://play.emulatorjs.com/nested?system=nes&rom=${romUrl}" allowfullscreen></iframe>`;
        }
    </script>

</body>
</html>
