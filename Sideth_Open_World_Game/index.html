<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sideth Cyber Shooter v1.2</title>
    <style>
        body { margin: 0; background: #050510; color: #fff; text-align: center; font-family: sans-serif; overflow: hidden; }
        #gameCanvas { background: #0b0b1a; display: block; margin: 10px auto; border: 2px solid #ff0055; border-radius: 12px; box-shadow: 0 0 20px #ff0055; }
        .ui { font-size: 16px; margin: 5px; color: #0ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">🔥 SIDETH SHOOTER v1.2 | Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let score = 0;
        let lives = 3;
        
        let player = { x: 180, y: 420, size: 25, color: "#0ff" };
        let bullets = [];
        let enemies = [];
        let stars = [];

        for(let i=0; i<40; i++) {
            stars.push({ x: Math.random()*360, y: Math.random()*480, size: Math.random()*2, speed: Math.random()*1.5 });
        }

        // Spawn Enemies
        setInterval(() => {
            if(enemies.length < 4) {
                enemies.push({
                    x: Math.random() * 300 + 30,
                    y: -20,
                    size: 20,
                    speed: Math.random() * 1.5 + 1.2,
                    color: "#ff0055"
                });
            }
        }, 1200);

        window.addEventListener("touchmove", (e) => {
            let rect = canvas.getBoundingClientRect();
            player.x = e.touches[0].clientX - rect.left;
        });

        window.addEventListener("mousemove", (e) => {
            let rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
        });

        window.addEventListener("click", () => {
            bullets.push({ x: player.x, y: player.y, radius: 4 });
        });

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = "#ffffff";
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
                s.y += s.speed; if(s.y > 480) s.y = 0;
            });

            // Draw Player Ship
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 10);
            ctx.lineTo(player.x - 12, player.y + 15);
            ctx.lineTo(player.x + 12, player.y + 15);
            ctx.closePath();
            ctx.fill();

            // Draw Bullets
            ctx.fillStyle = "#ffff00";
            bullets.forEach((b, index) => {
                b.y -= 9;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                if(b.y < 0) bullets.splice(index, 1);
            });

            // Draw Enemies
            enemies.forEach((en, eIndex) => {
                en.y += en.speed;
                ctx.fillStyle = en.color;
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.size, 0, Math.PI * 2);
                ctx.fill();

                // Check collision with player
                let pDist = Math.hypot(player.x - en.x, player.y - en.y);
                if(pDist < player.size + en.size - 10) {
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    enemies.splice(eIndex, 1);
                    if(lives <= 0) {
                        alert("Game Over, Sideth ❤️ Let's try again!");
                        score = 0; lives = 3;
                        document.getElementById("score").innerText = score;
                        document.getElementById("lives").innerText = lives;
                    }
                }

                // Check collision with bullets
                bullets.forEach((b, bIndex) => {
                    let hitDist = Math.hypot(b.x - en.x, b.y - en.y);
                    if(hitDist < en.size + b.radius) {
                        score += 20;
                        document.getElementById("score").innerText = score;
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                    }
                });

                // Missed enemy
                if(en.y > 480) {
                    enemies.splice(eIndex, 1);
                }
            });

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
