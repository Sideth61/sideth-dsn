<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private 2FA Authenticator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Password Protection Overlay -->
    <div id="authModal" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <div class="w-12 h-12 bg-blue-600/20 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-xl font-bold mb-2">Private Tool</h2>
            <p class="text-xs text-slate-400 mb-6">សូមបញ្ចូលពាក្យសម្ងាត់ដើម្បីចូលប្រើប្រាស់</p>
            <input type="password" id="sitePassword" placeholder="Password..." 
                class="w-full p-4 rounded-2xl bg-slate-800 border border-slate-700 text-white text-center font-mono text-sm mb-4 focus:outline-none focus:border-blue-500">
            <button onclick="checkPassword()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl transition">
                Login
            </button>
            <p id="errorMsg" class="text-xs text-rose-500 mt-3 hidden">ពាក្យសម្ងាត់មិនត្រឹមត្រូវ!</p>
        </div>
    </div>

    <!-- Main 2FA Content (Hidden until unlocked) -->
    <div id="mainContent" class="max-w-md w-full bg-white text-slate-800 p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100 relative hidden">
        
        <!-- Progress / Countdown Timer Bar -->
        <div class="w-full bg-slate-100 h-1.5 rounded-full mb-6 overflow-hidden">
            <div id="progressBar" class="bg-blue-600 h-full w-full transition-all duration-1000 linear"></div>
        </div>

        <!-- 2FA Secret Input Group -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-800 mb-2 flex items-center space-x-1.5">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                <span>* 2FA Secret</span>
            </label>
            <textarea id="secretInput" rows="3" placeholder="BK5V TVQ7 D2RB..."
                class="w-full p-4 rounded-2xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-slate-700 font-mono text-sm uppercase resize-none transition outline-none bg-slate-50/50"></textarea>
        </div>

        <!-- Submit Button -->
        <div class="mb-6">
            <button onclick="generateOTP()" class="w-full py-3.5 px-6 bg-blue-700 hover:bg-blue-800 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-blue-700/20 transition flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Submit</span>
            </button>
        </div>

        <!-- 2FA Code Output Group -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-slate-800 mb-2 flex items-center space-x-1.5">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span>* 2FA Code</span>
            </label>
            <div class="relative">
                <input type="text" id="codeOutput" readonly placeholder="ABC | 2FA Code"
                    class="w-full p-4 rounded-2xl border border-slate-200 bg-slate-50 text-slate-700 font-mono text-xl font-bold tracking-widest text-center outline-none select-all">
            </div>
        </div>

        <!-- Copy Button -->
        <div class="mb-8">
            <button onclick="copyCode()" class="w-full py-3.5 px-6 bg-blue-700 hover:bg-blue-800 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-blue-700/20 transition flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                <span id="copyBtnText">Copy</span>
            </button>
        </div>

        <!-- Footer Note -->
        <div class="text-center text-xs text-slate-500 leading-relaxed border-t border-slate-100 pt-6">
            <p class="mb-4">
                Use <a href="https://2fa.cn/" target="_blank" class="font-semibold text-blue-600 hover:underline">2fa.cn</a> online two-factor authentication (2FA) tools.
            </p>
            <p class="font-medium text-slate-400">2FA Copyright &copy; 2026 All rights reserved</p>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 text-sm font-medium flex items-center space-x-2">
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        // កំណត់ពាក្យសម្ងាត់របស់អ្នកនៅទីនេះ
        const ACCESS_PASSWORD = "@sidet99";

        function checkPassword() {
            const inputVal = document.getElementById('sitePassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputVal === ACCESS_PASSWORD) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('mainContent').classList.remove('hidden');
                showToast("ចូលប្រើប្រាស់បានสำเร็จ!");
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        // អនុញ្ញាតឱ្យចុច Enter ដើម្បី Login
        document.getElementById('sitePassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        let intervalId = null;

        function generateOTP() {
            const rawSecret = document.getElementById('secretInput').value;
            const output = document.getElementById('codeOutput');
            const cleanSecret = rawSecret.replace(/[\s\-\_\.]+/g, '').trim().toUpperCase();

            if (!cleanSecret) {
                showToast("សូមបញ្ចូល 2FA Secret Key!");
                output.value = "";
                return;
            }

            try {
                let secretObj = OTPAuth.Secret.fromBase32(cleanSecret);
                let totp = new OTPAuth.TOTP({
                    issuer: "2FA",
                    label: "User",
                    algorithm: "SHA1",
                    digits: 6,
                    period: 30,
                    secret: secretObj
                });

                let code = totp.generate();
                output.value = code;
                showToast("បង្កើតលេខកូដជោគជ័យ!");

                if (intervalId) clearInterval(intervalId);
                updateTimer();
                intervalId = setInterval(updateTimer, 1000);
            } catch (err) {
                output.value = "Error";
                showToast("Key មិនត្រឹមត្រូវ!");
            }
        }

        function updateTimer() {
            const epoch = Math.floor(new Date().getTime() / 1000.0);
            const secondsRemaining = 30 - (epoch % 30);
            const percentage = (secondsRemaining / 30) * 100;
            const progressBar = document.getElementById('progressBar');
            if (progressBar) progressBar.style.width = percentage + '%';

            if (secondsRemaining === 30) {
                const secret = document.getElementById('secretInput').value.trim();
                if (secret) generateOTP();
            }
        }

        function copyCode() {
            const codeOutput = document.getElementById('codeOutput');
            if (!codeOutput.value || codeOutput.value === "Error" || codeOutput.value === "") {
                showToast("គ្មានលេខកូដសម្រាប់ចម្លងទេ!");
                return;
            }
            codeOutput.select();
            document.execCommand('copy');
            showToast("បានចម្លងរួចរាល់!");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
