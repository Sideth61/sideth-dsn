<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Authenticator - Security Tool</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OTPAuth Library (Handles Base32 and TOTP Perfectly) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Top Header -->
    <header class="w-full py-4 px-6 flex justify-between items-center bg-white border-b border-slate-100 shadow-sm">
        <button onclick="toggleMenu()" class="p-2 text-slate-600 hover:text-slate-900 rounded-xl hover:bg-slate-100 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="flex items-center space-x-2">
            <button onclick="toggleSettings()" class="p-2 text-slate-600 hover:text-slate-900 rounded-xl bg-slate-50 hover:bg-slate-100 transition border border-slate-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <button onclick="toggleLanguage()" class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl border border-slate-200 transition flex items-center space-x-1">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                <span id="langText">中文版</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100 relative">
            
            <!-- Progress / Countdown Timer Bar -->
            <div class="w-full bg-slate-100 h-1.5 rounded-full mb-6 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-full w-full transition-all duration-1000 linear"></div>
            </div>

            <!-- 2FA Secret Input Group -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-800 mb-2 flex items-center space-x-1.5">
                    <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                    <span>* 2FA Secret</span>
                </label>
                <textarea id="secretInput" rows="3" placeholder="BK5V TVQ7 D2RB..."
                    class="w-full p-4 rounded-2xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-slate-700 font-mono text-sm uppercase resize-none transition outline-none bg-slate-50/50"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="mb-6">
                <button onclick="generateOTP()" class="w-full py-3.5 px-6 bg-blue-700 hover:bg-blue-800 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-blue-700/20 transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Submit</span>
                </button>
            </div>

            <!-- 2FA Code Output Group -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-800 mb-2 flex items-center space-x-1.5">
                    <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <span>* 2FA Code</span>
                </label>
                <div class="relative">
                    <input type="text" id="codeOutput" readonly placeholder="ABC | 2FA Code"
                        class="w-full p-4 rounded-2xl border border-slate-200 bg-slate-50 text-slate-700 font-mono text-xl font-bold tracking-widest text-center outline-none select-all">
                </div>
            </div>

            <!-- Copy Button -->
            <div class="mb-8">
                <button onclick="copyCode()" class="w-full py-3.5 px-6 bg-blue-700 hover:bg-blue-800 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-blue-700/20 transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <span id="copyBtnText">Copy</span>
                </button>
            </div>

            <!-- Footer Note -->
            <div class="text-center text-xs text-slate-500 leading-relaxed border-t border-slate-100 pt-6">
                <p class="mb-4">
                    Use <a href="https://2fa.cn/" target="_blank" class="font-semibold text-blue-600 hover:underline">2fa.cn</a> online two-factor authentication (2FA) tools to enhance account security. For more information on two-factor authentication, visit authoritative resources or search "2fa.cn 2FA tools".
                </p>
                <p class="font-medium text-slate-400">2FA Copyright &copy; 2026 All rights reserved</p>
            </div>

        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 text-sm font-medium flex items-center space-x-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg">Copied successfully!</span>
    </div>

    <!-- JavaScript Implementation using OTPAuth -->
    <script>
        let intervalId = null;

        function generateOTP() {
            const rawSecret = document.getElementById('secretInput').value;
            const output = document.getElementById('codeOutput');

            // សម្អាតដកឃ្លា និងប្តូរជាអក្សរធំ
            const secret = rawSecret.replace(/\s+/g, '').trim().toUpperCase();

            if (!secret) {
                showToast("សូមបញ្ចូល 2FA Secret Key!");
                output.value = "";
                return;
            }

            try {
                // ប្រើប្រាស់ OTPAuth ក្នុងការបង្កើតលេខកូដ TOTP យ៉ាងត្រឹមត្រូវ
                let totp = new OTPAuth.TOTP({
                    issuer: "2FA Tool",
                    label: "Account",
                    algorithm: "SHA1",
                    digits: 6,
                    period: 30,
                    secret: secret 
                });

                let code = totp.generate();
                output.value = code;
                showToast("បង្កើតលេខកូដជោគជ័យ!");

                if (intervalId) clearInterval(intervalId);
                updateTimer();
                intervalId = setInterval(updateTimer, 1000);

            } catch (err) {
                output.value = "Error";
                showToast("Key មិនត្រឹមត្រូវ សូមពិនិត្យម្ដងទៀត!");
            }
        }

        function updateTimer() {
            const epoch = Math.floor(new Date().getTime() / 1000.0);
            const secondsRemaining = 30 - (epoch % 30);
            const percentage = (secondsRemaining / 30) * 100;

            const progressBar = document.getElementById('progressBar');
            if (progressBar) {
                progressBar.style.width = percentage + '%';
            }

            if (secondsRemaining === 30) {
                const secret = document.getElementById('secretInput').value.trim();
                if (secret) {
                    generateOTP();
                }
            }
        }

        function copyCode() {
            const codeOutput = document.getElementById('codeOutput');
            if (!codeOutput.value || codeOutput.value === "Error" || codeOutput.value === "") {
                showToast("គ្មានលេខកូដសម្រាប់ចម្លងទេ!");
                return;
            }

            codeOutput.select();
            document.execCommand('copy');
            showToast("បានចម្លងរួចរាល់!");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function toggleMenu() {
            showToast("មុខងារ Menu");
        }

        function toggleSettings() {
            showToast("ការកំណត់ត្រូវបានបើក");
        }

        let currentLang = 'km';
        function toggleLanguage() {
            const langText = document.getElementById('langText');
            if (currentLang === 'km') {
                currentLang = 'zh';
                langText.innerText = 'English';
                showToast("ប្តូរទៅភាសាចិន");
            } else if (currentLang === 'zh') {
                currentLang = 'en';
                langText.innerText = 'ភាសាខ្មែរ';
                showToast("ប្តូរទៅភាសាអង់គ្លេស");
            } else {
                currentLang = 'km';
                langText.innerText = '中文版';
                showToast("ប្តូរទៅភាសាខ្មែរ");
            }
        }
    </script>
</body>
</html>
