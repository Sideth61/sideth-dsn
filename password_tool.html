<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN Security & Password Analyzer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
        body { font-family: 'Kantumruy Pro', sans-serif; background: #090d16; color: #fff; padding: 20px; text-align: center; margin: 0; padding-bottom: 90px; }
        .box { background: #111827; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 20px; }
        p { color: #94a3b8; font-size: 13px; text-align: center; }
        .input-field { width: 100%; padding: 12px; margin: 15px 0; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; font-family: 'Kantumruy Pro', sans-serif; }
        .strength-meter { height: 8px; width: 100%; background: #334155; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; transition: 0.3s; }
        #result { font-weight: bold; font-size: 14px; margin-top: 10px; text-align: center; }
        .btn-back { display: block; text-align: center; background: #2563eb; color: #fff; padding: 12px; margin-top: 20px; text-decoration: none; border-radius: 10px; font-weight: bold; }
        .btn-back:hover { background: #1d4ed8; }

        /* Floating Dock */
        .dsn-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3); padding: 10px 20px; border-radius: 30px;
            display: flex; gap: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); z-index: 999;
        }
        .dock-item { font-size: 20px; text-decoration: none; padding: 8px; border-radius: 50%; display: flex; transition: 0.3s; }
        .dock-item:hover { background: rgba(56, 189, 248, 0.2); transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛡️ DSN Password Security Analyzer</h2>
        <p>ពិនិត្យមើលថាតើ Password ណាមួយងាយស្រួល ឬពិបាកក្នុងការ Hack!</p>
        
        <input type="text" id="pwdInput" class="input-field" placeholder="បញ្ចូល Password ដើម្បីឆែក..." oninput="checkPassword()">
        
        <div class="strength-meter">
            <div id="strengthBar" class="strength-bar"></div>
        </div>
        
        <div id="result">សូមបញ្ចូល Password...</div>

        <a href="index.html" class="btn-back">🏠 ត្រឡប់ទៅ DSN OS វិញ</a>
    </div>

    <!-- Floating Dock -->
    <div class="dsn-dock">
        <a href="index.html" class="dock-item" title="ទំព័រដើម">🏠</a>
        <a href="password_tool.html" class="dock-item" title="Password Tool" style="background: rgba(56, 189, 248, 0.2); border-radius: 50%;">🔐</a>
        <a href="facebook.html" class="dock-item" title="ហ្វេសប៊ុក">📘</a>
        <a href="money_tool.html" class="dock-item" title="Money Tool">💰</a>
        <a href="setting.html" class="dock-item" title="ការកំណត់">⚙️</a>
    </div>

    <script>
        function checkPassword() {
            let pwd = document.getElementById('pwdInput').value;
            let bar = document.getElementById('strengthBar');
            let res = document.getElementById('result');
            
            let strength = 0;
            if (pwd.length === 0) {
                bar.style.width = "0%";
                res.innerHTML = "សូមបញ្ចូល Password...";
                res.style.color = "#94a3b8";
                return;
            }

            if (pwd.length >= 8) strength++;
            if (/[A-Z]/.test(pwd)) strength++;
            if (/[0-9]/.test(pwd)) strength++;
            if (/[^A-Za-z0-9]/.test(pwd)) strength++;

            if (strength === 1) {
                bar.style.width = "25%";
                bar.style.background = "#ef4444";
                res.innerHTML = "⚠️ ខ្សោយខ្លាំង (ងាយនឹងត្រូវ Hack ក្នុងរយៈពេលប៉ុន្មានវិនាទី!)";
                res.style.color = "#ef4444";
            } else if (strength === 2 || strength === 3) {
                bar.style.width = "65%";
                bar.style.background = "#f59e0b";
                res.innerHTML = "⚡ មធ្យម (គួរតែបន្ថែមអក្សរធំ ឬនិមិត្តសញ្ញា)";
                res.style.color = "#f59e0b";
            } else if (strength === 4) {
                bar.style.width = "100%";
                bar.style.background = "#10b981";
                res.innerHTML = "🔒 រឹងមាំខ្លាំង (សុវត្ថិភាពខ្ពស់ ពិបាក Hack បំផុត!)";
                res.style.color = "#10b981";
            }
        }
    </script>
</body>
</html>
