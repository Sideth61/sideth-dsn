<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:image" content="https://sideth.site/image.png">
<meta property="og:url" content="https://sideth.site">

<!-- 📱 PWA Icons -->
<link rel="apple-touch-icon" href="sideth-ai.jpg">
<link rel="icon" type="image/jpeg" href="sideth-ai.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sideth AI">

<!-- 🎨 Modern UI Style -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600&display=swap');

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Kantumruy Pro', sans-serif;
}

body {
background-color: #0f172a;
color: #f8fafc;
display: flex;
flex-direction: column;
height: 100vh;
max-width: 600px;
margin: 0 auto;
border-left: 1px solid rgba(255, 255, 255, 0.1);
border-right: 1px solid rgba(255, 255, 255, 0.1);
}

.header {
padding: 15px;
background: #1e293b;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.header h1 {
font-size: 14px;
color: #38bdf8;
}

button {
border: none;
border-radius: 6px;
color: white;
cursor: pointer;
transition: opacity 0.2s;
}

button:hover {
opacity: 0.8;
}

.chat-container {
flex: 1;
overflow-y: auto;
padding: 15px;
display: flex;
flex-direction: column;
gap: 12px;
}

.message {
max-width: 80%;
padding: 10px 14px;
border-radius: 12px;
font-size: 14px;
line-height: 1.5;
word-break: break-word;
}

.message.ai {
background: #1e293b;
color: #e2e8f0;
align-self: flex-start;
border-bottom-left-radius: 2px;
}

.message.user {
background: #2563eb;
color: white;
align-self: flex-end;
border-bottom-right-radius: 2px;
}

.input-area {
padding: 12px;
background: #1e293b;
border-top: 1px solid rgba(255, 255, 255, 0.1);
}

input[type="text"] {
flex: 1;
padding: 10px 14px;
background: #0f172a;
border: 1px solid rgba(255, 255, 255, 0.2);
border-radius: 8px;
color: white;
outline: none;
}

input[type="text"]:focus {
border-color: #38bdf8;
}
</style>
</head>
<body>

<div class="header">
<h1>👮 DSN Google AI SIDETH (V3.6) 👮</h1>
<div style="display: flex; gap: 6px;">
<button onclick="setApiKey()" style="padding: 6px 10px; background: #3b82f6; font-size: 11px;">🔑 API</button>
<button onclick="clearHistory()" style="padding: 6px 10px; background: #ef4444; font-size: 11px;">🗑️ លុប</button>
</div>
</div>

<div class="chat-container" id="chatBox">
<div class="message ai">សួស្ដីបាទ! ខ្ញុំឈ្មោះ សាន ស៊ីដេត❤️️ ថ្ងៃនេះអ្នកមានអ្វីចង់ឱ្យខ្ញុំជួយ? 😘💚</div>
</div>

<div class="input-area" style="display: flex; flex-direction: column; gap: 8px;">
<div id="previewContainer" style="display: none; align-items: center; gap: 10px;">
<img id="imagePreview" src="" alt="Preview" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);">
<span style="font-size: 12px; color: #94a3b8;">បានជ្រើសរើសរូបភាពរួចរាល់ 🖼️</span>
<button onclick="removeImage()" style="padding: 4px 8px; background: #ef4444; font-size: 12px;">លុបចេញ</button>
</div>

<div style="display: flex; width: 100%; gap: 8px; align-items: center;">
<label for="imageInput" style="padding: 10px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
📷
</label>
<input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewSelectedImage(event)" />
<input type="text" id="userInput" placeholder="សរសេរការបញ្ជា ឬសួរសំណួរទីនេះ..." onkeypress="handleKeyPress(event)" />
<button onclick="sendMessage()" style="padding: 10px 16px; background: #2563eb; font-weight: bold;">➤</button>
</div>
</div>

<script>
let selectedImageBase64 = null;
let selectedImageMimeType = "image/jpeg";

window.onload = function() {
const savedChat = localStorage.getItem('dsn_chat_history_v3_6');
if (savedChat) {
document.getElementById('chatBox').innerHTML = savedChat;
scrollToBottom();
}
if (!localStorage.getItem('gemini_user_key')) {
setTimeout(setApiKey, 500);
}
};

function setApiKey() {
let currentKey = localStorage.getItem('gemini_user_key') || '';
let userKey = prompt("🔑 សូមបញ្ចូល DSN Google API Key របស់បងទីនេះ:", currentKey);
if (userKey !== null && userKey.trim() !== "") {
localStorage.setItem('gemini_user_key', userKey.trim());
alert("បញ្ជូល API Key រួចរាល់ហើយ! 😘✨");
}
}

function previewSelectedImage(event) {
const file = event.target.files[0];
if (file) {
selectedImageMimeType = file.type;
const reader = new FileReader();
reader.onload = function(e) {
selectedImageBase64 = e.target.result.split(',')[1];
document.getElementById('imagePreview').src = e.target.result;
document.getElementById('previewContainer').style.display = 'flex';
};
reader.readAsDataURL(file);
}
}

function removeImage() {
selectedImageBase64 = null;
document.getElementById('imageInput').value = '';
document.getElementById('previewContainer').style.display = 'none';
}

function scrollToBottom() {
const chatBox = document.getElementById('chatBox');
chatBox.scrollTop = chatBox.scrollHeight;
}

function saveChatHistory() {
const chatBox = document.getElementById('chatBox').innerHTML;
localStorage.setItem('dsn_chat_history_v3_6', chatBox);
}

function clearHistory() {
localStorage.removeItem('dsn_chat_history_v3_6');
document.getElementById('chatBox').innerHTML = `<div class="message ai">សួស្ដីបង Sideth❤️️ អូន NiTa❤️️ បានសម្អាតប្រវត្តិជជែករួចរាល់ហើយ! 😘</div>`;
}

async function sendMessage() {
const apiKey = localStorage.getItem('gemini_user_key');
if (!apiKey) {
alert("សូមកំណត់ API Key ជាមុនសិន!");
setApiKey();
return;
}

const input = document.getElementById('userInput');
const chatBox = document.getElementById('chatBox');
const message = input.value.trim();
if (!message && !selectedImageBase64) return;

let userHtml = `<div class="message user">`;
if (selectedImageBase64) {
userHtml += `<img src="data:${selectedImageMimeType};base64,${selectedImageBase64}" style="max-width: 100%; border-radius: 8px; display: block; margin-bottom: 6px;">`;
}
if (message) {
userHtml += `<span>${message}</span>`;
}
userHtml += `</div>`;
chatBox.innerHTML += userHtml;

const currentInput = message;
const currentImg = selectedImageBase64;
const currentMime = selectedImageMimeType;

input.value = '';
removeImage();
scrollToBottom();
saveChatHistory();

const loadingId = 'loading-' + Date.now();
chatBox.innerHTML += `<div class="message ai" id="${loadingId}">ស៊ីដេត កំពុងគិតចម្លើយជូនអ្នក..... ⏳</div>`;
scrollToBottom();

try {
let parts = [];
if (currentInput) {
parts.push({ text: currentInput });
}
if (currentImg) {
parts.push({
inlineData: {
mimeType: currentMime,
data: currentImg
}
});
}

const requestBody = {
contents: [{ parts: parts }]
};

// 🔧 កែប្រែ Endpoint មកប្រើ gemini-1.5-flash (រហ័ស និងត្រឹមត្រូវ)
const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(requestBody)
});

const data = await response.json();
const aiMessageElement = document.getElementById(loadingId);

if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
let text = data.candidates[0].content.parts[0].text;
// រៀបចំការចុះបន្ទាត់ឱ្យស្អាត
aiMessageElement.innerHTML = text.replace(/\n/g, '<br>');
} else {
console.error("API Error Details:", data);
aiMessageElement.innerText = "អុញណ៎! មានបញ្ហា៖ " + (data.error?.message || "សូមពិនិត្យមើល API Key ឡើងវិញ មាសស្នេហ៍!");
}
scrollToBottom();
saveChatHistory();
} catch (error) {
document.getElementById(loadingId).innerText = "សូមអភ័យទោស! មិនអាចតភ្ជាប់ទៅកាន់ Google API បានទេ (Connection Error)។ 🔌";
scrollToBottom();
}
}

function handleKeyPress(event) {
if (event.key === 'Enter') {
sendMessage();
}
}
</script>
</body>
</html>
```
