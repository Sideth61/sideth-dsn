<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN Telegram Bot Center - San Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin-top: 20px;
        }
        /* រចនាប័ទ្មសម្រាប់ Cover Image ខាងលើสุด */
        .site-cover {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid #00ff66;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }
        .site-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #00ff66;
            font-size: 22px;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }
        .bot-card {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(0, 255, 102, 0.3);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .bot-card:hover {
            border-color: #00ff66;
            background: rgba(0, 255, 102, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 255, 102, 0.3);
        }
        .bot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* រចនាប័ទ្មសម្រាប់រូបភាពតំណាងក្នុងកាតនីមួយៗ */
        .bot-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 102, 0.1);
            flex-shrink: 0;
        }
        .bot-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bot-title {
            font-weight: 600;
            font-size: 14px;
            color: #f8fafc;
        }
        .bot-desc {
            font-size: 11px;
            color: #94a3b8;
        }
        .arrow {
            color: #00ff66;
            font-size: 16px;
            font-weight: bold;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- រូបភាព Cover របស់ Index (index.jpg) -->
        <div class="site-cover">
            <img src="index.jpg" alt="DSN Bot Center Cover">
        </div>

        <h1>🤖 DSN Telegram Bot Hub</h1>
        <p>ជ្រើសរើស Telegram Bot របស់ San Sideth ដែលបងចង់ប្រើប្រាស់៖</p>

        <!-- Sideth Bot -->
        <a href="sideth_bot.html" class="bot-card">
            <div class="bot-info">
                <div class="bot-icon">
                    <img src="sideth_bot.JPG" alt="Sideth Bot Icon">
                </div>
                <div>
                    <div class="bot-title">Sideth Bot</div>
                    <div class="bot-desc">ប្រព័ន្ធជំនួយការផ្ទាល់ខ្លួនរបស់ Sideth</div>
                </div>
            </div>
            <div class="arrow">➔</div>
        </a>

        <!-- DSN OS Bot -->
        <a href="dsnos_bot.html" class="bot-card">
            <div class="bot-info">
                <div class="bot-icon">
                    <img src="dsnos_bot.jpg" alt="DSN OS Bot Icon">
                </div>
                <div>
                    <div class="bot-title">DSN OS Bot</div>
                    <div class="bot-desc">ប្រព័ន្ធបញ្ជាកម្រិត God-Tier OS</div>
                </div>
            </div>
            <div class="arrow">➔</div>
        </a>

        <!-- Sideth Mail Bot -->
        <a href="https://t.me/sideth_mail_bot" target="_blank" class="bot-card">
            <div class="bot-info">
                <div class="bot-icon">
                    <img src="sideth_mail_bot.jpg" alt="Sideth Mail Bot Icon">
                </div>
                <div>
                    <div class="bot-title">Sideth Mail Bot</div>
                    <div class="bot-desc">ប្រព័ន្ធគ្រប់គ្រងសារ និងអ៊ីមែល</div>
                </div>
            </div>
            <div class="arrow">➔</div>
        </a>

        <a href="../index.html" class="back-link">🏠 ត្រឡប់ទៅទំព័រដើមវិញ (Home)</a>
    </div>
</body>
</html>
