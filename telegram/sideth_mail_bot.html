<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sideth Mail Bot - DSN Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin-top: 30px;
            text-align: center;
        }
        .icon-box {
            font-size: 50px;
            background: rgba(0, 255, 102, 0.1);
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 20px rgba(0,255,102,0.2);
        }
        h1 {
            color: #00ff66;
            font-size: 22px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #00ff66;
            color: #030712;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.4);
            margin-bottom: 15px;
        }
        .btn-telegram:hover {
            background: #00cc52;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 102, 0.6);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">📧</div>
        <h1>Sideth Mail Bot</h1>
        <p>ប្រព័ន្ធគ្រប់គ្រងសារ និងអ៊ីមែលស្វ័យប្រវត្តិ។ ចុចប៊ូតុងខាងក្រោមដើម្បីចាប់ផ្តើមប្រើប្រាស់ Bot នេះនៅលើ Telegram ផ្ទាល់ខ្លួនរបស់អ្នក។</p>

        <a href="https://t.me/sideth_mail_bot" target="_blank" class="btn-telegram">
            🚀 បើកใช้งานលើ Telegram
        </a>

        <div>
            <a href="index.html" class="back-link">🏠 ត្រឡប់ទៅទំព័រដើមវិញ</a>
        </div>
    </div>
</body>
</html>
