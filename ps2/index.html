<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sideth Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Sideth's Retro & PS2 Web Hub</h1>
        <p class="subtitle">លេងហ្គេមតាមទូរសព្ទដោយមិនបាច់ប្រើ Computer ឬ Sideload! 😘</p>
        
        <div class="game-grid">
            <div class="game-card" onclick="loadGame('PS2')">
                <h3>PlayStation 2 Web</h3>
                <p>PS2 ISO</p>
            </div>
            <div class="game-card" onclick="loadGame('PPSSPP')">
                <h3>PSP Emulator Web</h3>
                <p> Metal Slug & Retro Games</p>
            </div>
        </div>
        
        <!-- អេក្រង់ Emulator តែមួយរួមបញ្ចូលគ្នា ត្រៀមរត់ហ្គេម -->
        <div id="emulator-screen">
            <h3>🎮 កំពុងភ្ជាប់ Web Emulator Core...</h3>
            <p>ໂຫຼດ File ISO ហ្គេមរបស់អ្នកចូលទីនេះដើម្បីចាប់ផ្ដើមដំណើរការ! 💚</p>
            
            <input type="file" id="gameFile" accept=".iso,.bin,.img" onchange="runEmulator(event)" style="margin-top: 15px; color: #38bdf8;">
            
            <!-- Canvas សម្រាប់បង្ហាញរូបភាពហ្គេមរត់ចេញមក -->
            <canvas id="emulator-canvas" width="480" height="272" style="background: black; width: 100%; margin-top: 15px; border-radius: 8px; display: none;"></canvas>
            
            <div id="file-info" style="margin-top: 10px; font-size: 13px; color: #94a3b8;"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
