<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact & Feedback - Deth DSN</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');

        :root {
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --bg-main: #090d16;
            --bg-secondary: #1e1b4b;
            --card-bg: rgba(17, 24, 39, 0.86);
            --input-bg: #1e293b;
            --border: rgba(56, 189, 248, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background:
                radial-gradient(
                    circle at 15% 15%,
                    var(--accent-glow),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(99, 102, 241, 0.15),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    var(--bg-main),
                    var(--bg-secondary)
                );

            background-attachment: fixed;

            color: #fff;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

            overflow-x: hidden;
        }

        /* =========================
           THEMES
        ========================= */

        body.theme-dark {
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --bg-main: #090d16;
            --bg-secondary: #1e1b4b;
        }

        body.theme-cyber {
            --accent: #ff4dff;
            --accent-glow: rgba(255, 77, 255, 0.35);
            --bg-main: #12001c;
            --bg-secondary: #2b0640;
        }

        body.theme-ocean {
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --bg-main: #001522;
            --bg-secondary: #003b4d;
        }

        body.theme-matrix {
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.35);
            --bg-main: #020b05;
            --bg-secondary: #062514;
        }

        body.theme-quantum {
            --accent: #f43f5e;
            --accent-glow: rgba(244, 63, 94, 0.35);
            --bg-main: #18052b;
            --bg-secondary: #3b0a45;
        }

        /* =========================
           CANVAS
        ========================= */

        #effectCanvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 1;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 450px;

            display: flex;
            flex-direction: column;

            gap: 20px;

            z-index: 10;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: var(--card-bg);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            padding: 25px;

            border-radius: 20px;

            border: 1px solid var(--border);

            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 0, 0, 0.15);

            text-align: left;

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent);

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.6),
                0 0 20px var(--accent-glow);
        }

        /* =========================
           TITLE
        ========================= */

        .title {
            color: var(--accent);

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 18px;

            text-align: center;

            padding-bottom: 12px;

            border-bottom: 1px solid var(--accent-glow);
        }

        .subtitle {
            color: #94a3b8;

            font-size: 12px;

            line-height: 1.7;

            text-align: center;

            margin-bottom: 20px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;

            color: #94a3b8;

            font-size: 12px;

            margin-bottom: 6px;

            font-weight: 600;
        }

        .input-field {
            width: 100%;

            padding: 11px 14px;

            background: var(--input-bg);

            border: 1px solid #334155;

            border-radius: 10px;

            color: #fff;

            font-family: 'Kantumruy Pro', sans-serif;

            font-size: 13px;

            outline: none;

            resize: vertical;

            transition: 0.3s;
        }

        .input-field::placeholder {
            color: #64748b;
        }

        .input-field:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 12px var(--accent-glow);
        }

        textarea.input-field {
            min-height: 110px;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            width: 100%;

            padding: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #2563eb
                );

            color: #fff;

            border: none;

            border-radius: 12px;

            font-weight: bold;

            font-family: 'Kantumruy Pro', sans-serif;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 4px 15px var(--accent-glow);
        }

        .btn:hover {
            filter: brightness(1.12);

            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn.secondary {
            background: #1e293b;

            border: 1px solid #334155;

            box-shadow: none;

            margin-top: 8px;
        }

        .btn.danger {
            background: #ef4444;

            margin-top: 8px;
        }

        /* =========================
           STATUS
        ========================= */

        .status-box {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(0, 0, 0, 0.35);

            border-left: 3px solid var(--accent);

            color: #cbd5e1;

            font-size: 12px;

            line-height: 1.6;
        }

        .status-box.show {
            display: block;

            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MESSAGE HISTORY
        ========================= */

        .history-item {
            background: rgba(2, 6, 23, 0.65);

            border: 1px solid #334155;

            border-radius: 12px;

            padding: 12px;

            margin-bottom: 10px;
        }

        .history-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 8px;

            margin-bottom: 7px;
        }

        .history-name {
            color: var(--accent);

            font-size: 13px;

            font-weight: 700;
        }

        .history-time {
            color: #64748b;

            font-size: 9px;
        }

        .history-message {
            color: #cbd5e1;

            font-size: 12px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .history-actions {
            display: flex;

            gap: 6px;

            margin-top: 10px;
        }

        .small-btn {
            flex: 1;

            border: 1px solid #334155;

            background: #0f172a;

            color: #cbd5e1;

            padding: 6px;

            border-radius: 7px;

            font-family: 'Kantumruy Pro', sans-serif;

            font-size: 10px;

            cursor: pointer;
        }

        .small-btn:hover {
            border-color: var(--accent);

            color: var(--accent);
        }

        .empty-history {
            color: #64748b;

            text-align: center;

            font-size: 12px;

            padding: 10px;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-btn {
            display: block;

            text-align: center;

            background: #1e293b;

            border: 1px solid #334155;

            color: #fff;

            padding: 12px;

            border-radius: 12px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.3);
        }

        .back-btn:hover {
            background: #334155;

            border-color: var(--accent);

            transform: translateY(-2px);
        }

        /* =========================
           FLOATING DOCK
        ========================= */

        .dsn-dock {
            position: fixed;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            background: rgba(17, 24, 39, 0.88);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid var(--border);

            padding: 10px 20px;

            border-radius: 30px;

            display: flex;

            gap: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.6),
                0 0 15px var(--accent-glow);

            z-index: 999;
        }

        .dock-item {
            font-size: 20px;

            text-decoration: none;

            transition: 0.3s;

            padding: 8px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .dock-item:hover {
            background: var(--accent-glow);

            transform:
                translateY(-5px)
                scale(1.1);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 14px;

                padding-bottom: 115px;
            }

            .card {
                padding: 20px;
            }

            .dsn-dock {
                bottom: 12px;

                gap: 8px;

                padding: 8px 12px;
            }

            .dock-item {
                font-size: 18px;

                padding: 7px;
            }
        }
    </style>
</head>

<body class="theme-dark">

    <canvas id="effectCanvas"></canvas>

    <div class="container">

        <!-- =========================
             CONTACT FORM
        ========================== -->

        <div class="card">

            <div class="title">
                📬 ទំនាក់ទំនង និង Feedback
            </div>

            <div class="subtitle">
                ផ្ញើសារ មតិយោបល់ ឬសំណូមពរមកកាន់
                <strong style="color: var(--accent);">
                    B Sideth
                </strong>
                💛🌺
            </div>

            <div class="input-group">

                <label>

                </label>

                <input
                    type="text"
                    id="senderName"
                    class="input-field"

                >

            </div>

            <div class="input-group">

                <label>
                    💬 សារ ឬមតិយោបល់
                </label>

                <textarea
                    id="senderMsg"
                    class="input-field"
                    maxlength="2000"
                    placeholder="សរសេរមតិ ឬសំណូមពររបស់អ្នកទីនេះ..."
                ></textarea>

            </div>

            <button
                class="btn"

            </button>

            ></div>

        </div>


        <!-- =========================
             MESSAGE HISTORY
        ========================== -->

        <div class="card">

            <div class="title">

            </div>

            <div id="messageHistory">
                <div class="empty-history">
                    មិនទាន់មានសារដែលបានរក្សាទុកទេ 📭

        <!-- =========================

        <a
            href="index.html"

    <!-- =========================

    <div class="dsn-dock">

        <a

    <script>

        /* =====================================================
           DSN CONTACT SYSTEM
        ===================================================== */

        const STORAGE_KEY = 'dsn_contact_messages';

        let audioCtx = null;


        /* =========================
           SOUND ENGINE
        ========================== */

        function playSound(freq = 600) {

            try {

                if (!audioCtx) {

                    audioCtx =
                        new (
                            window.AudioContext ||
                            window.webkitAudioContext
                        )();

                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                osc.type = 'sine';

                osc.frequency.setValueAtTime(
                    freq,
                    audioCtx.currentTime
                );

                osc.frequency.exponentialRampToValueAtTime(
                    freq + 150,
                    audioCtx.currentTime + 0.05
                );

                gain.gain.setValueAtTime(
                    0.035,
                    audioCtx.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    audioCtx.currentTime + 0.06
                );

                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );

                osc.start();

                osc.stop(
                    audioCtx.currentTime + 0.06
                );

            } catch (error) {}

        }


        /* =========================
           STATUS
        ========================== */

        function showStatus(message, success = true) {

            const box =
                document.getElementById('statusBox');

            box.innerHTML =
                (success ? '✅ ' : '⚠️ ') +
                escapeHTML(message);

            box.style.borderLeftColor =
                success
                    ? 'var(--accent)'
                    : '#f43f5e';

            box.classList.add('show');

            setTimeout(() => {

                box.classList.remove('show');

            }, 4000);

        }


        /* =========================
           SEND MESSAGE
        ========================== */

        function sendMessage() {

            const name =
                document
                    .getElementById('senderName')
                    .value
                    .trim();

            const msg =
                document
                    .getElementById('senderMsg')
                    .value
                    .trim();


            if (!name || !msg) {

                playSound(300);

                showStatus(
                    'សូមបំពេញឈ្មោះ និងសាររបស់អ្នកជាមុនសិន!',
                    false
                );

                return;
            }


            if (msg.length < 3) {

                showStatus(
                    'សារខ្លីពេក 😝 សូមសរសេរឱ្យបានច្បាស់បន្តិច។',
                    false
                );

                return;
            }


            const messages =
                getMessages();


            messages.unshift({

                id:
                    Date.now(),

                name:
                    name,

                message:
                    msg,

                time:
                    new Date().toLocaleString(
                        'km-KH',
                        {
                            dateStyle: 'medium',
                            timeStyle: 'short'
                        }
                    )

            });


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(messages)
            );


            document
                .getElementById('senderName')
                .value = '';

            document
                .getElementById('senderMsg')
                .value = '';


            renderMessages();

            playSound(900);


            showStatus(
                `អរគុណ ${name}! សាររបស់អ្នកត្រូវបានរក្សាទុកក្នុង DSN OS ដោយជោគជ័យហើយ 💛🌺`
            );

        }


        /* =========================
           GET MESSAGES
        ========================== */

        function getMessages() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        STORAGE_KEY
                    ) || '[]'
                );

            } catch (error) {

                return [];

            }

        }


        /* =========================
           RENDER HISTORY
        ========================== */

        function renderMessages() {

            const container =
                document.getElementById(
                    'messageHistory'
                );

            const messages =
                getMessages();


            if (!messages.length) {

                container.innerHTML = `
                    <div class="empty-history">
                        មិនទាន់មានសារដែលបានរក្សាទុកទេ 📭
                    </div>
                `;

                return;
            }


            container.innerHTML =
                messages
                    .map(message => `

                        <div class="history-item">

                            <div class="history-header">

                                <span class="history-name">
                                    👤 ${escapeHTML(message.name)}
                                </span>

                                <span class="history-time">
                                    ${escapeHTML(message.time)}
                                </span>

                            </div>

                            <div class="history-message">
                                ${escapeHTML(message.message)}
                            </div>

                            <div class="history-actions">

                                <button
                                    class="small-btn"
                                    onclick="copyMessage(${message.id})"
                                >
                                    📋 Copy
                                </button>

                                <button
                                    class="small-btn"
                                    onclick="deleteMessage(${message.id})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>

                    `)
                    .join('');

        }


        /* =========================
           COPY MESSAGE
        ========================== */

        async function copyMessage(id) {

            const message =
                getMessages()
                    .find(item => item.id === id);

            if (!message) return;


            const text =
                `ឈ្មោះ: ${message.name}\n\n${message.message}`;


            try {

                await navigator.clipboard.writeText(text);

                playSound(700);

                showStatus(
                    'បាន Copy សារទៅ Clipboard ហើយ 📋'
                );

            } catch (error) {

                showStatus(
                    'Browser មិនអនុញ្ញាតឱ្យ Copy ដោយស្វ័យប្រវត្តិទេ។',
                    false
                );

            }

        }


        /* =========================
           DELETE MESSAGE
        ========================== */

        function deleteMessage(id) {

            const confirmed =
                confirm(
                    'តើចង់លុបសារនេះមែនទេ?'
                );

            if (!confirmed) return;


            const messages =
                getMessages()
                    .filter(
                        message =>
                            message.id !== id
                    );


            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(messages)
            );


            renderMessages();

            playSound(350);

        }


        /* =========================
           CLEAR HISTORY
        ========================== */

        function clearHistory() {

            const messages =
                getMessages();


            if (!messages.length) {

                showStatus(
                    'មិនមានប្រវត្តិសារសម្រាប់លុបទេ។',
                    false
                );

                return;
            }


            const confirmed =
                confirm(
                    '⚠️ តើបងពិតជាចង់លុបប្រវត្តិសារទាំងអស់មែនទេ?'
                );


            if (!confirmed) return;


            localStorage.removeItem(
                STORAGE_KEY
            );


            renderMessages();

            playSound(300);

            showStatus(
                'បានសម្អាតប្រវត្តិសារទាំងអស់ហើយ 🗑️'
            );

        }


        /* =========================
           HTML ESCAPE
        ========================== */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        /* =====================================================
           CANVAS EFFECT ENGINE
        ===================================================== */

        const canvas =
            document.getElementById(
                'effectCanvas'
            );

        const ctx =
            canvas.getContext('2d');


        let particles = [];

        let currentEffect =
            'none';


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }


        window.addEventListener(
            'resize',
            resizeCanvas
        );


        resizeCanvas();


        function initParticles(type) {

            currentEffect = type;

            particles = [];


            if (
                type === 'none'
            ) {
                return;
            }


            const count =
                type === 'rain'
                    ? 80
                    : type === 'matrix'
                        ? 55
                        : 50;


            for (
                let i = 0;
                i < count;
                i++
            ) {

                particles.push({

                    x:
                        Math.random() *
                        canvas.width,

                    y:
                        Math.random() *
                        canvas.height,

                    speed:
                        type === 'rain'
                            ? Math.random() * 5 + 4
                            : type === 'matrix'
                                ? Math.random() * 4 + 2
                                : Math.random() * 0.5 + 0.2,

                    length:
                        Math.random() * 20 + 10,

                    radius:
                        Math.random() * 2 + 1,

                    opacity:
                        Math.random() * 0.7 + 0.3,

                    char:
                        String.fromCharCode(
                            0x30A0 +
                            Math.floor(
                                Math.random() * 96
                            )
                        )

                });

            }

        }


        function animateParticles() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            if (
                currentEffect !== 'none'
            ) {

                const accent =
                    getComputedStyle(
                        document.documentElement
                    )
                        .getPropertyValue(
                            '--accent'
                        )
                        .trim() ||
                    '#38bdf8';


                particles.forEach(p => {

                    ctx.beginPath();


                    if (
                        currentEffect === 'rain'
                    ) {

                        ctx.strokeStyle =
                            accent;

                        ctx.globalAlpha =
                            p.opacity;

                        ctx.lineWidth = 1.2;

                        ctx.moveTo(
                            p.x,
                            p.y
                        );

                        ctx.lineTo(
                            p.x - 1,
                            p.y + p.length
                        );

                        ctx.stroke();


                        p.y += p.speed;

                        p.x -= 0.5;


                        if (
                            p.y >
                            canvas.height
                        ) {

                            p.y = -20;

                            p.x =
                                Math.random() *
                                canvas.width;

                        }

                    }


                    else if (
                        currentEffect === 'stars'
                    ) {

                        ctx.fillStyle =
                            '#ffffff';

                        ctx.globalAlpha =
                            p.opacity;

                        ctx.arc(
                            p.x,
                            p.y,
                            p.radius,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();


                        p.y += p.speed;


                        if (
                            p.y >
                            canvas.height
                        ) {

                            p.y = 0;

                            p.x =
                                Math.random() *
                                canvas.width;

                        }

                    }


                    else if (
                        currentEffect === 'matrix'
                    ) {

                        ctx.fillStyle =
                            accent;

                        ctx.globalAlpha =
                            p.opacity;

                        ctx.font =
                            '14px monospace';

                        ctx.fillText(
                            p.char,
                            p.x,
                            p.y
                        );


                        p.y += p.speed;


                        if (
                            p.y >
                            canvas.height
                        ) {

                            p.y = 0;

                            p.x =
                                Math.random() *
                                canvas.width;

                            p.char =
                                String.fromCharCode(
                                    0x30A0 +
                                    Math.floor(
                                        Math.random() * 96
                                    )
                                );

                        }

                    }

                });

            }


            ctx.globalAlpha = 1;

            requestAnimationFrame(
                animateParticles
            );

        }


        animateParticles();


        /* =====================================================
           THEME / EFFECT LOADER
        ===================================================== */

        function loadThemeAndEffect() {

            const savedTheme =
                localStorage.getItem(
                    'dsn_theme'
                ) || 'theme-dark';


            const allowedThemes = [
                'theme-dark',
                'theme-cyber',
                'theme-ocean',
                'theme-matrix',
                'theme-quantum'
            ];


            document.body.className =
                allowedThemes.includes(
                    savedTheme
                )
                    ? savedTheme
                    : 'theme-dark';


            const savedEffect =
                localStorage.getItem(
                    'dsn_effect'
                ) || 'none';


            const allowedEffects = [
                'none',
                'rain',
                'stars',
                'matrix'
            ];


            initParticles(
                allowedEffects.includes(
                    savedEffect
                )
                    ? savedEffect
                    : 'none'
            );

        }


        /* =====================================================
           KEYBOARD SHORTCUT
        ===================================================== */

        document
            .getElementById('senderMsg')
            .addEventListener(
                'keydown',
                function(event) {

                    if (
                        event.ctrlKey &&
                        event.key === 'Enter'
                    ) {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );


        /* =====================================================
           INIT
        ===================================================== */

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                loadThemeAndEffect();

                renderMessages();

            }
        );

    </script>

</body>
