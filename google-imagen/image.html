<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Imagen - Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 750px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #6200ee;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .settings-toggle { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .settings-toggle:hover { background: rgba(255,255,255,0.3); }

        .settings-panel {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            display: none;
            gap: 12px;
            flex-direction: column;
        }
        .settings-panel.active { display: flex; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 0.85rem; font-weight: 500; color: #555; }
        .input-group input { padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }

        .output-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fdfdfd;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            background: #6200ee;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            background: #f1f3f4;
            color: #202124;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .message.error {
            background: #fce8e6;
            color: #c5221f;
            align-self: center;
        }

        .input-area {
            padding: 15px 20px;
            background: #ffffff;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            resize: none;
            height: 48px;
            max-height: 120px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .input-area textarea:focus { outline: none; border-color: #6200ee; }
        .send-btn {
            background: #6200ee;
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .send-btn:hover { background: #4bb543; }
        .typing { font-style: italic; color: #666; font-size: 0.85rem; display: none; padding: 0 20px 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fa-solid fa-image"></i> Google Imagen Generator</h2>
        <button class="settings-toggle" onclick="toggleSettings()"><i class="fa-solid fa-gear"></i> កំណត់ API</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="input-group">
            <label>API Endpoint:</label>
            <input type="text" id="endpoint" value="https://chatprovider.org/proxy/google-ai-imagen">
        </div>
        <div class="input-group">
            <label>API Key:</label>
            <input type="password" id="apiKey" value="ea85c8475a50a105df15454a1a88cd733ac40710128a54d4302f5fdd758e8b95">
        </div>
        <div class="input-group">
            <label>Model Name:</label>
            <input type="text" id="modelName" value="imagen-4.0-ultra-generate-001">
        </div>
    </div>

    <div class="output-box" id="outputBox">
        <div class="message bot">សួស្តី! ផ្ញើការពិពណ៌នារូបភាព (Prompt) ដែលបងចង់បង្កើតមក ខ្ញុំនឹងជំនួយគូរជូន។ (តម្លៃ 10 credits ក្នុងមួយសំណើ)</div>
    </div>

    <div class="typing" id="typingIndicator"><i class="fa-solid fa-spinner fa-spin"></i> AI កំពុងបង្កើតរូបភាពជូនបង សូមរង់ចាំបន្តិច...</div>

    <div class="input-area">
        <textarea id="userInput" placeholder="ពណ៌នារូបភាពដែលចង់បង្កើត (ឧទាហរណ៍: a futuristic cyberpunk city)..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" onclick="generateImage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.classList.toggle('active');
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            generateImage();
        }
    }

    async function generateImage() {
        const endpoint = document.getElementById('endpoint').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const modelName = document.getElementById('modelName').value.trim();
        const userInput = document.getElementById('userInput');
        const outputBox = document.getElementById('outputBox');
        const typingIndicator = document.getElementById('typingIndicator');

        const promptText = userInput.value.trim();
        if (!promptText) return;

        // បង្ហាញសំណើ User
        outputBox.innerHTML += `<div class="message user">${escapeHtml(promptText)}</div>`;
        userInput.value = '';
        outputBox.scrollTop = outputBox.scrollHeight;

        typingIndicator.style.display = 'block';

        try {
            // OpenAI Image Generations format standard
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: modelName,
                    prompt: promptText,
                    n: 1,
                    size: "1024x1024"
                })
            });

            const data = await response.json();
            typingIndicator.style.display = 'none';

            let botReplyHtml = "";
            if (data.data && data.data.length > 0) {
                // ប្រសិនបើជា URL រូបភាព ឬ Base64
                const imgUrl = data.data[0].url || data.data[0].b64_json;
                if (imgUrl) {
                    botReplyHtml = `នេះគឺជារូបភាពដែលបានបង្កើត៖<br><img src="${imgUrl.startsWith('http') ? imgUrl : 'data:image/png;base64,' + imgUrl}" alt="Generated Image">`;
                } else {
                    botReplyHtml = JSON.stringify(data);
                }
            } else if (data.error) {
                botReplyHtml = "កំហុសពី Server: " + (data.error.message || JSON.stringify(data.error));
            } else {
                botReplyHtml = JSON.stringify(data);
            }

            outputBox.innerHTML += `<div class="message bot">${botReplyHtml}</div>`;
            outputBox.scrollTop = outputBox.scrollHeight;

        } catch (error) {
            typingIndicator.style.display = 'none';
            outputBox.innerHTML += `<div class="message error">មានបញ្ហាក្នុងការតភ្ជាប់៖ ${error.message}</div>`;
            outputBox.scrollTop = outputBox.scrollHeight;
        }
    }

    function escapeHtml(unsafe) {
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
