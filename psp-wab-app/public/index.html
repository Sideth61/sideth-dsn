<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSP Web Emulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PSP Web Emulator</h1>
    <div class="controls">
      <label for="isoPicker" class="btn-upload">ជ្រើសរើសឯកសារ PSP (.iso / .cso)</label>
      <input type="file" id="isoPicker" accept=".iso,.cso">
    </div>
    <p id="status">សូមជ្រើសរើសឯកសារ ISO ពីក្នុងម៉ាស៊ីនរបស់អ្នក...</p>
  </header>

  <main>
    <div id="game-container">
      <div id="game"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
