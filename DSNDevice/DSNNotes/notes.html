<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>📝 DSN Notes Web App - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        header h1 { font-size: 16px; color: var(--accent); }
        .btn-add { background: var(--accent); color: #030712; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .notes-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .note-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; position: relative; }
        .note-title { font-size: 14px; font-weight: bold; color: #fff; }
        .note-snippet { font-size: 12px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .editor-container { display: none; flex-direction: column; gap: 10px; }
        input[type="text"], textarea { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; }
        input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
        textarea { height: 50vh; resize: none; }
        .btn-group { display: flex; gap: 10px; }
        .btn-save { flex: 1; background: #10b981; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .back-link { display: block; text-align: center; color: var(--text-sub); text-decoration: none; font-size: 13px; margin-top: auto; padding-top: 15px; }
    </style>
</head>
<body>
    <header id="mainHeader">
        <h1>📝 DSN Notes Web App</h1>
        <button class="btn-add" onclick="openEditor()">+ កត់ត្រាថ្មី</button>
    </header>

    <!-- List View -->
    <div class="notes-grid" id="notesList">
        <!-- Dynamic Notes will appear here -->
    </div>

    <!-- Editor View -->
    <div class="editor-container" id="editorContainer">
        <input type="text" id="noteTitleInput" placeholder="ចំណងជើងកំណត់ត្រា...">
        <textarea id="noteContentInput" placeholder="សរសេរខ្លឹមសារនៅទីនេះ..."></textarea>
        <div class="btn-group">
            <button class="btn-save" onclick="saveNote()">💾 រក្សាទុក</button>
            <button class="btn-cancel" onclick="closeEditor()">❌ បោះបង់</button>
        </div>
    </div>

    <a href="index.html" class="back-link" id="backLink">⬅️ ត្រឡប់ទៅ Device Center</a>

    <script>
        let notes = JSON.parse(localStorage.getItem('dsn_notes_list')) || [];

        function renderNotes() {
            let listEl = document.getElementById('notesList');
            listEl.innerHTML = '';
            if (notes.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:var(--text-sub); font-size:13px; margin-top:20px;">មិនទាន់มีកំណត់ត្រាទេ មាសស្នេហ៍!</p>';
                return;
            }
            notes.forEach((note, index) => {
                let card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <div class="note-title">${note.title || 'គ្មានចំណងជើង'}</div>
                    <div class="note-snippet">${note.content}</div>
                    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-sub); margin-top:4px;">
                        <span>${note.date}</span>
                        <span style="color:#ef4444; cursor:pointer;" onclick="deleteNote(${index})">🗑️ លុប</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function openEditor() {
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('notesList').style.display = 'none';
            document.getElementById('backLink').style.display = 'none';
            document.getElementById('editorContainer').style.display = 'flex';
            document.getElementById('noteTitleInput').value = '';
            document.getElementById('noteContentInput').value = '';
        }

        function closeEditor() {
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('notesList').style.display = 'flex';
            document.getElementById('backLink').style.display = 'block';
            document.getElementById('editorContainer').style.display = 'none';
        }

        function saveNote() {
            let title = document.getElementById('noteTitleInput').value.trim();
            let content = document.getElementById('noteContentInput').value.trim();
            if (!content) {
                alert('សូមសរសេរខ្លឹមសារកំណត់ត្រាសិន មាសស្នេហ៍!');
                return;
            }
            let date = new Date().toLocaleDateString('km-KH');
            notes.unshift({ title, content, date });
            localStorage.setItem('dsn_notes_list', JSON.stringify(notes));
            closeEditor();
            renderNotes();
        }

        function deleteNote(index) {
            if (confirm('តើបងចង់លុបកំណត់ត្រានេះមែនទេ?')) {
                notes.splice(index, 1);
                localStorage.setItem('dsn_notes_list', JSON.stringify(notes));
                renderNotes();
            }
        }

        renderNotes();
    </script>
</body>
</html>
