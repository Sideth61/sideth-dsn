<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>💬 DSN AI Chat - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border-color); background: var(--card-bg); backdrop-filter: blur(12px); }
        header h1 { font-size: 15px; color: var(--accent); }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .user-msg { background: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { padding: 12px 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; backdrop-filter: blur(12px); }
        input[type="text"] { flex: 1; background: #000; border: 1px solid var(--border-color); color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn-send { background: var(--accent); color: #030712; border: none; padding: 10px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .back-link { color: var(--text-sub); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-link">⬅️ ត្រឡប់</a>
        <h1>💬 DSN AI Chat</h1>
        <span style="font-size: 18px;">⚙️</span>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-msg">
            សួស្តីបង **Sideth❤️️**! តើចង់ឱ្យអូនជួយសរសេរកូដ ឬដោះស្រាយបញ្ហាអ្វីថ្ងៃហ្នឹង មាសស្នេហ៍? 😘
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="សរសេរសារទីនេះ..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById('userInput');
            let text = input.value.trim();
            if(!text) return;

            let container = document.getElementById('chatContainer');
            
            // User Message
            let userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = text;
            container.appendChild(userDiv);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Simulated AI Response
            setTimeout(() => {
                let aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-msg';
                aiDiv.textContent = "បាទអូនបានទទួលសំណួររបស់បង Sideth❤️️ ហើយ! កំពុងដំណើរការជូនភ្លាមៗចាស៑ 😘🚀។";
                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 600);
        }

        function handleKeyPress(e) {
            if(e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
