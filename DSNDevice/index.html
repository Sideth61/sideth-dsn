<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sideth's DSN Device Center 📱</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>⚙️ DSN DEVICE CENTER V1.0</h1>
        <div class="grid" id="device-info">
            <div class="card">
                <span>📱 Browser / OS</span>
                <strong id="os-info">Loading...</strong>
            </div>
            <div class="card">
                <span>🔋 Battery</span>
                <strong id="battery-info">Checking...</strong>
            </div>
            <div class="card">
                <span>💾 Storage</span>
                <strong id="storage-info">Calculating...</strong>
            </div>
            <div class="card">
                <span>🌐 Network Status</span>
                <strong id="network-info">Online</strong>
            </div>
        </div>

        <!-- ប៊ូតុងតភ្ជាប់ទៅកាន់ Game Center -->
        <div style="margin-top: 20px; text-align: center;">
            <a href="https://sideth.site/game" target="_blank" style="display: inline-block; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #030712; padding: 12px 24px; border-radius: 12px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); width: 100%;">
                🎮 ចូលទៅកាន់ DSN Game Center
            </a>
        </div>

        <!-- ប៊ូតុងតភ្ជាប់ទៅកាន់ New AI -->
        <div style="margin-top: 12px; text-align: center;">
            <a href="https://sideth.site/google/new_ai.html" target="_blank" style="display: inline-block; background: linear-gradient(135deg, #10b981, #059669); color: #030712; padding: 12px 24px; border-radius: 12px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); width: 100%;">
                ✨ ចូលទៅកាន់ New AI
            </a>
        </div>
    </div>
    <script src="device.js"></script>
</body>
</html>
