<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sideth's DSN Device Center 📱</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>⚙️ DSN DEVICE CENTER V1.0</h1>
        <div class="grid" id="device-info">
            <div class="card">
                <span>📱 Browser / OS</span>
                <strong id="os-info">Loading...</strong>
            </div>
            <div class="card">
                <span>🔋 Battery</span>
                <strong id="battery-info">Checking...</strong>
            </div>
            <div class="card">
                <span>💾 Storage</span>
                <strong id="storage-info">Calculating...</strong>
            </div>
            <div class="card">
                <span>🌐 Network Status</span>
                <strong id="network-info">Online</strong>
            </div>
        </div>
    </div>
    <script src="device.js"></script>
</body>
</html>
