<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎣 DSN Phishing Detector - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); backdrop-filter: blur(12px); }
        h1 { font-size: 18px; color: var(--accent); text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; color: var(--text-sub); }
        input { width: 100%; padding: 12px 15px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #030712; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; font-size: 14px; }
        .feedback { font-size: 13px; font-weight: bold; min-height: 25px; text-align: center; }
        .back-link { display: block; text-align: center; color: var(--text-sub); text-decoration: none; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎣 Phishing URL Detector</h1>
        <div class="input-group">
            <label>ពិនិត្យ Link / Domain សង្ស័យ៖</label>
            <input type="text" id="urlInput" placeholder="ឧ. https://login.facebook.com.xx...">
        </div>
        <button class="btn" onclick="checkURL()">🔍 ពិនិត្យសុវត្ថិភាព</button>
        <div class="feedback" id="feedbackText"></div>
        <a href="index.html" class="back-link">⬅️ ត្រឡប់ក្រោយ</a>
    </div>

    <script>
        function checkURL() {
            let url = document.getElementById('urlInput').value.trim().toLowerCase();
            let feedback = document.getElementById('feedbackText');
            if(!url) { feedback.textContent = "⚠️ សូមបញ្ចូល Link ជាមុនសិន!"; feedback.style.color = "#f59e0b"; return; }
            
            // ពិនិត្យរកសញ្ញា Phishing
            if(url.includes('login') && !url.includes('google.com') && !url.includes('github.com') || url.includes('.xx') || url.includes('free') || url.includes('secure-update')) {
                feedback.textContent = "🚨 ប្រយ័ត្ន! នេះជា Phishing Link បន្លំខ្លួន!";
                feedback.style.color = "#ef4444";
            } else {
                labelSafe: {
                    feedback.textContent = "✅ Link នេះមើលទៅមានសុវត្ថិភាពល្អ!";
                    feedback.style.color = "#10b981";
                }
            }
        }
    </script>
</body>
</html>
