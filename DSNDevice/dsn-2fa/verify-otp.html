<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>📲 Verify OTP - DSN OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .container { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 15px; }
        h1 { font-size: 18px; color: var(--accent); text-align: center; text-shadow: 0 0 10px rgba(56,189,248,0.4); }
        p { font-size: 13px; color: var(--text-sub); text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: var(--text-sub); }
        input { width: 100%; padding: 14px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none; font-size: 20px; text-align: center; letter-spacing: 5px; font-weight: bold; }
        input:focus { border-color: var(--accent); }
        .btn-main { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #030712; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 15px; margin-top: 5px; box-shadow: 0 4px 15px rgba(56,189,248,0.3); }
        .back-link { display: block; text-align: center; color: var(--text-sub); text-decoration: none; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📲 ផ្ទៀងផ្ទាត់កូដ OTP</h1>
        <p>សូមបញ្ចូលលេខកូដ 6 ខ្ទង់ដែលបានបញ្ជូនទៅកាន់ Email ឬ App របស់អ្នក</p>

        <div class="form-group">
            <label>🔑 OTP Code</label>
            <input type="text" id="otpInput" maxlength="6" placeholder="------">
        </div>

        <button class="btn-main" onclick="verifyOTP()">✅ تصديق / ផ្ទៀងផ្ទាត់</button>
        <a href="recovery.html" class="back-link">⬅️ ត្រឡប់ក្រោយ</a>
    </div>

    <script>
        function verifyOTP() {
            let otp = document.getElementById('otpInput').value.trim();
            if(otp.length !== 6) {
                alert('⚠️ សូមបញ្ចូលលេខកូដ OTP ឱ្យបានគ្រប់ 6 ខ្ទង់!');
                return;
            }
            alert('✅ ផ្ទៀងផ្ទាត់ជោគជ័យ! កំពុងបញ្ជូនទៅកាន់ទំព័របង្កើត Password ថ្មី...');
            window.location.href = 'reset-password.html';
        }
    </script>
</body>
</html>
