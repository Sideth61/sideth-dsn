<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🔑 DSN Authenticator Web App - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); backdrop-filter: blur(16px); }
        h1 { font-size: 16px; color: var(--accent); text-align: center; }
        .account-card { background: #000; border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .account-name { font-size: 13px; color: var(--text-sub); }
        .otp-code { font-size: 28px; font-weight: bold; color: #10b981; letter-spacing: 4px; }
        .timer-bar { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; margin-top: 5px; }
        .timer-progress { height: 100%; width: 100%; background: var(--accent); transition: width 1s linear; }
        .btn-add { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #030712; border: none; padding: 12px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
        .back-link { display: block; text-align: center; color: var(--text-sub); text-decoration: none; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 DSN Authenticator</h1>
        
        <div class="account-card">
            <div class="account-name">🛡️ GitHub (sideth-dsn)</div>
            <div class="otp-code" id="otpGitHub">482 910</div>
            <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
        </div>

        <div class="account-card">
            <div class="account-name">🌐 Google (San Sideth)</div>
            <div class="otp-code" id="otpGoogle">739 124</div>
        </div>

        <button class="btn-add" onclick="alert('មុខងារបន្ថែម Account ថ្មីនឹងមកដល់ឆាប់ៗ!')">+ បន្ថែម Account ថ្មី</button>
        <a href="index.html" class="back-link">⬅️ ត្រឡប់ទៅ Device Center</a>
        <!-- ប៊ូតុងរត់ទៅស្កេន QR Code ឬបន្ថែមគណនី -->
<div style="margin-top: 20px; display: flex; gap: 10px;">
    <a href="scanner.html" style="padding: 10px 15px; background: #3b82f6; color: #fff; border-radius: 8px; text-decoration: none;">📷 ស្កេន QR Code</a>
    <a href="add-account.html" style="padding: 10px 15px; background: #10b981; color: #fff; border-radius: 8px; text-decoration: none;">➕ បន្ថែមគណនីដោយដៃ</a>
</div>

    </div>

    <script>
        function updateOTP() {
            let code1 = Math.floor(100 + Math.random() * 900) + " " + Math.floor(100 + Math.random() * 900);
            let code2 = Math.floor(100 + Math.random() * 900) + " " + Math.floor(100 + Math.random() * 900);
            document.getElementById('otpGitHub').textContent = code1;
            document.getElementById('otpGoogle').textContent = code2;
        }

        // Timer animation effect
        let timeLeft = 30;
        setInterval(() => {
            timeLeft--;
            let progress = (timeLeft / 30) * 100;
            document.getElementById('timerProgress').style.width = progress + '%';
            if (timeLeft <= 0) {
                timeLeft = 30;
                updateOTP();
            }
        }, 1000);
    </script>
</body>
</html>
