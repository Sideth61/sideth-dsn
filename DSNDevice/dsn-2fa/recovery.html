<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🔑 DSN Password Recovery - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .container { width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(12px); }
        h1 { font-size: 18px; color: var(--accent); text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px rgba(56,189,248,0.4); }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        label { font-size: 13px; color: var(--text-sub); }
        input { width: 100%; padding: 12px 15px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--accent); }
        .btn-main { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #030712; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 15px; margin-top: 10px; box-shadow: 0 4px 15px rgba(56,189,248,0.3); }
        .back-link { display: block; text-align: center; margin-top: 15px; color: var(--text-sub); text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 DSN Password Recovery</h1>
        <div class="form-group">
            <label>📧 Recovery Email ឬ 📱 Phone Number</label>
            <input type="text" id="identityInput" placeholder="san.sideth@dsn.os">
        </div>
        <button class="btn-main" onclick="startRecovery()">🔎 ស្វែងរកគណនី</button>
        <a href="index.html" class="back-link">⬅️ ត្រឡប់ទៅទំព័រដើម</a>
    </div>

    <script>
        function startRecovery() {
            let id = document.getElementById('identityInput').value.trim();
            if(!id) {
                alert('⚠️ សូមបញ្ចូល Email ឬ លេខទូរសព្ទជាមុនសិន!');
                return;
            }
            alert('✅ បានផ្ញើកូដផ្ទៀងផ្ទាត់ (OTP) ទៅកាន់ ' + id);
            // ជំហានបន្ទាប់៖ បញ្ជូនទៅកាន់ទំព័រ verify-otp.html
        }
    </script>
</body>
</html>
