<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎵 DSN Music Center Pro - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #030712; 
            --card-bg: rgba(15, 23, 42, 0.85); 
            --border-color: rgba(56, 189, 248, 0.3); 
            --accent: #38bdf8; 
            --text-main: #f8fafc; 
            --text-sub: #94a3b8; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { 
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-color) 100%); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 15px; 
            justify-content: center; 
        }
        .player-container { 
            width: 100%; 
            max-width: 380px; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 28px; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); 
            backdrop-filter: blur(20px); 
        }
        .header-title { 
            font-size: 15px; 
            color: var(--accent); 
            text-align: center; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }
        .album-art-box { 
            width: 170px; 
            height: 170px; 
            margin: 5px auto; 
            border-radius: 50%; 
            border: 3px solid var(--accent); 
            overflow: hidden; 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35); 
            background: #000; 
            transition: transform 0.3s ease;
        }
        .album-art-box.playing img {
            animation: spin 15s linear infinite;
        }
        .album-art-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
        .song-info { text-align: center; }
        .song-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .artist-name { font-size: 13px; color: var(--text-sub); }
        
        .progress-container { display: flex; flex-direction: column; gap: 6px; }
        input[type="range"] { 
            width: 100%; 
            accent-color: var(--accent); 
            cursor: pointer; 
            height: 4px;
        }
        .time-info { 
            display: flex; 
            justify-content: space-between; 
            font-size: 11px; 
            color: var(--text-sub); 
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 18px; 
            margin: 4px 0;
        }
        .btn-control { 
            background: rgba(255,255,255,0.06); 
            border: 1px solid var(--border-color); 
            color: #fff; 
            font-size: 18px; 
            cursor: pointer; 
            width: 46px; 
            height: 46px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s ease; 
        }
        .btn-control:active { transform: scale(0.92); }
        .btn-control.main { 
            width: 58px; 
            height: 58px; 
            background: linear-gradient(135deg, #0284c7, #38bdf8); 
            color: #030712; 
            font-size: 22px; 
            border: none;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .upload-btn {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px dashed var(--accent);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .playlist-section { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            max-height: 130px; 
            overflow-y: auto; 
            padding-right: 4px;
        }
        .playlist-item { 
            background: rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.08); 
            padding: 10px 14px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .playlist-item.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }

        .back-link { 
            display: block; 
            text-align: center; 
            color: var(--text-sub); 
            text-decoration: none; 
            font-size: 12px; 
            margin-top: 5px; 
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="header-title">🎵 DSN Music Center</div>
        
        <div class="album-art-box" id="albumArtBox">
            <img id="albumArt" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" alt="Album Art">
        </div>

        <div class="song-info">
            <div class="song-title" id="songTitleDisplay">ទាហ៊ានមុំបី ភ្នំ750</div>
            <div class="artist-name" id="artistDisplay">San Sideth</div>
        </div>

        <div class="progress-container">
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <div class="time-info">
                <span id="currentTime">00:00</span>
                <span id="durationTime">00:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn-control" onclick="prevSong()">⏮️</button>
            <button class="btn-control main" id="playPauseBtn" onclick="togglePlay()">▶️</button>
            <button class="btn-control" onclick="nextSong()">⏭️</button>
        </div>

        <!-- ជម្រើស Upload ចម្រៀងផ្ទាល់ខ្លួន -->
        <label class="upload-btn">
            📂 បើកចម្រៀងពីទូរស័ព្ទ / PC
            <input type="file" id="fileUpload" accept="audio/*" style="display:none" onchange="handleFileUpload(event)">
        </label>

        <div class="playlist-section" id="playlist"></div>

        <a href="index.html" class="back-link">⬅️ ត្រឡប់ទៅ Device Center</a>
    </div>

    <audio id="audioElement" preload="metadata"></audio>

    <script>
        // បញ្ជីបទចម្រៀងគំរូ (អាចជំនួស src ដោយ URL mp3 ពិតប្រាកដរបស់អ្នក)
        const songs = [
            { 
                title: "ទាហ៊ានមុំបី ភ្នំ750 (Demo)", 
                artist: "San Sideth", 
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300"
            },
            { 
                title: "Blaming All Men (Demo)", 
                artist: "DSN Creator", 
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300"
            }
        ];

        let currentSongIndex = 0;
        const audio = document.getElementById('audioElement');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const songTitleDisplay = document.getElementById('songTitleDisplay');
        const artistDisplay = document.getElementById('artistDisplay');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const albumArtBox = document.getElementById('albumArtBox');
        const albumArt = document.getElementById('albumArt');
        const playlistEl = document.getElementById('playlist');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${idx === currentSongIndex ? 'active' : ''}`;
                item.onclick = () => selectSong(idx);
                item.innerHTML = `<span>🎵 ${song.title}</span> <span>${idx === currentSongIndex ? '🔊' : '▶️'}</span>`;
                playlistEl.appendChild(item);
            });
        }

        function loadSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            songTitleDisplay.textContent = song.title;
            artistDisplay.textContent = song.artist;
            if (song.cover) albumArt.src = song.cover;
            audio.src = song.src;
            renderPlaylist();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playPauseBtn.textContent = "⏸️";
                    albumArtBox.classList.add('playing');
                }).catch(err => {
                    alert('មិនអាចចាក់បានទេ! សូមពិនិត្យតំណភ្ជាប់ URL ឬជ្រើសរើសឯកសារ MP3 ពីទូរស័ព្ទ។');
                });
            } else {
                audio.pause();
                playPauseBtn.textContent = "▶️";
                albumArtBox.classList.remove('playing');
            }
        }

        function selectSong(index) {
            loadSong(index);
            audio.play().then(() => {
                playPauseBtn.textContent = "⏸️";
                albumArtBox.classList.add('playing');
            });
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            selectSong(currentSongIndex);
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            selectSong(currentSongIndex);
        }

        // ការអូសបន្ទាត់ Progress Bar
        audio.ontimeupdate = () => {
            if (!isNaN(audio.duration)) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        };

        progressBar.oninput = () => {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        };

        audio.onended = nextSong;

        // មុខងារបញ្ចូលចម្រៀងពី Device
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                const customSong = {
                    title: file.name.replace(/\.[^/.]+$/, ""),
                    artist: "Local Device",
                    src: objectUrl,
                    cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300"
                };
                songs.unshift(customSong);
                selectSong(0);
            }
        }

        // ចាប់ផ្តើមទាញយកបទដំបូងពេលបើក Web
        loadSong(0);
    </script>
</body>
</html>
