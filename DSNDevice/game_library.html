<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sideth's PS2 Game Library 🎮</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
background-color: #030712;
color: #38bdf8;
font-family: 'Kantumruy Pro', sans-serif;
padding: 15px;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
}
.container {
width: 100%;
max-width: 480px;
background: rgba(15, 23, 42, 0.85);
border: 1px solid rgba(56, 189, 248, 0.3);
border-radius: 20px;
padding: 20px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
backdrop-filter: blur(12px);
margin-bottom: 20px;
}
h1 {
text-align: center;
color: #f8fafc;
font-size: 20px;
margin-bottom: 15px;
text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
}
.search-box {
width: 100%;
padding: 12px 15px;
background: #000000;
border: 1px solid #38bdf8;
color: #ffffff;
border-radius: 12px;
outline: none;
font-size: 14px;
margin-bottom: 15px;
}
.game-list {
display: flex;
flex-direction: column;
gap: 12px;
max-height: 380px;
overflow-y: auto;
padding-right: 5px;
}
.game-card {
background: linear-gradient(135deg, #1e293b, #0f172a);
border: 1px solid rgba(56, 189, 248, 0.2);
border-radius: 14px;
padding: 12px 15px;
display: flex;
justify-content: space-between;
align-items: center;
transition: all 0.3s ease;
}
.game-info h3 {
color: #f8fafc;
font-size: 15px;
margin-bottom: 3px;
}
.game-info span {
color: #94a3b8;
font-size: 12px;
}
.btn-play {
background: linear-gradient(135deg, #0284c7, #38bdf8);
color: #0f172a;
border: none;
padding: 8px 14px;
border-radius: 10px;
font-weight: bold;
font-size: 13px;
cursor: pointer;
text-decoration: none;
}
.back-btn {
display: block;
text-align: center;
background: #1e293b;
color: #94a3b8;
padding: 12px;
border-radius: 12px;
text-decoration: none;
font-weight: bold;
font-size: 14px;
border: 1px solid rgba(148, 163, 184, 0.2);
}
.loading {
text-align: center;
color: #94a3b8;
padding: 20px;
}
</style>
</head>
<body>
<div class="container">
<h1>🎮 DSN PS2 Game Hub</h1>
<input type="text" id="searchInput" class="search-box" placeholder="🔎 ស្វែងរកហ្គេម PS2..." onkeyup="searchGame()">
<div class="game-list" id="gameListContainer">
<div class="loading">⏳ កំពុងទាញយកបញ្ជីហ្គេមពី Worker...</div>
</div>
</div>
<div style="width: 100%; max-width: 480px;">
<a href="index.html" class="back-btn">⬅️ ត្រឡប់ទៅទំព័រដើម (Home)</a>
</div>
<script src="js/api.js"></script>
<script>
let allGames = [];
async function loadGames() {
const container = document.getElementById('gameListContainer');
const games = await DSNAPI.getGames();
if (games && games.length > 0) {
allGames = games;
renderGames(allGames);
} else {
container.innerHTML = ⁠<div class="loading" style="color: #f43f5e;">⚠️ រកមិនឃើញបញ្ជីហ្គេមទេប្រុសស្អិត!</div>⁠;
}
}
function renderGames(games) {
const container = document.getElementById('gameListContainer');
container.innerHTML = '';
games.forEach(game => {
const card = document.createElement('div');
card.className = 'game-card';
card.innerHTML = ⁠<div class="game-info"> <h3>🕹️ ${game.name || game.title || 'PS2 Game'}</h3> <span>Telegram Cloud / ISO</span> </div> <a href="emulator.html?title=${encodeURIComponent(game.name || game.title)}&game=${encodeURIComponent(game.file_id || game.name)}" class="btn-play">▶ Play</a>⁠;
container.appendChild(card);
});
}
function searchGame() {
let input = document.getElementById('searchInput').value.toLowerCase();
let filtered = allGames.filter(g => (g.name || g.title || '').toLowerCase().includes(input));
renderGames(filtered);
}
window.onload = loadGames;
</script>
</body>
</html>
