<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎨 DSN Image Generation - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 18px; color: var(--accent); }
        .preview-box { width: 100%; height: 320px; background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .placeholder-text { color: var(--text-sub); font-size: 14px; text-align: center; padding: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; height: 90px; padding: 12px 15px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none; font-size: 14px; resize: none; }
        textarea:focus { border-color: var(--accent); }
        button { padding: 14px; background: linear-gradient(135deg, #0284c7, #38bdf8); color: #030712; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; }
        .nav-back { display: inline-block; color: var(--text-sub); text-decoration: none; font-size: 13px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="nav-back">← ត្រឡប់ក្រោយវិញ</a>
        <header>
            <h1>🎨 DSN Image AI</h1>
            <span style="font-size: 12px; color: #10b981;">● Ready</span>
        </header>

        <div class="preview-box" id="previewBox">
            <span class="placeholder-text" id="placeholderText">រូបភាពដែលបានបង្កើតនឹងបង្ហាញទីនេះ... 🖼️</span>
            <img id="generatedImage" alt="Generated AI Image">
        </div>

        <div class="input-group">
            <textarea id="imagePrompt" placeholder="ពណ៌នារូបភាពដែលបងចង់បង្កើត (ឧទាហរណ៍៖ រូបខ្លារខិនកំពុងរត់ក្នុងព្រៃ)..."></textarea>
            <button onclick="generateImage()">បង្កើតរូបភាពឥឡូវនេះ 🚀</button>
        </div>
    </div>

    <script src="js/media.js"></script>
    <script>
        async function generateImage() {
            let prompt = document.getElementById('imagePrompt').value.trim();
            let placeholder = document.getElementById('placeholderText');
            let imgElement = document.getElementById('generatedImage');
            if(!prompt) return alert("សូមបញ្ចូលការពណ៌នា (Prompt) ជាមុនសិន!");

            placeholder.innerText = "កំពុងបង្កើតរូបភាពជូនបង Sideth... ⏳";
            
            // ហៅមុខងារពី media.js
            let imageUrl = await DSNMedia.generateImage(prompt);
            
            if(imageUrl) {
                imgElement.src = imageUrl;
                imgElement.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                // តេស្តបង្ហាញរូបភាពអចិន្ត្រៃយ៍បើ Server ឆ្លើយតបមកធម្មតា ឬ Mockup
                placeholder.innerText = "⚠️ មានបញ្ហាបន្តិចបន្តួច ឬត្រូវភ្ជាប់ Server API Key!";
            }
        }
    </script>
</body>
</html>
