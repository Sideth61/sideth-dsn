<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>⚙️ DSN Settings - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        header h1 { font-size: 16px; color: var(--accent); }
        .setting-group { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .btn-action { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #030712; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .back-link { display: block; text-align: center; color: var(--text-sub); text-decoration: none; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>⚙️ Browser Settings</h1>
    </header>

    <div class="setting-group">
        <div class="setting-item">
            <span>🌙 Dark Mode (Default)</span>
            <input type="checkbox" checked disabled>
        </div>
        <div class="setting-item">
            <span>🔒 Incognito / Private Mode</span>
            <button class="btn-action" onclick="alert('បានបើកដំណើរការ Private Mode!')">Enable</button>
        </div>
        <div class="setting-item">
            <span>🗑️ Clear Browser Data</span>
            <button class="btn-action" style="background: #ef4444; color: #fff;" onclick="alert('លុបទិន្នន័យជោគជ័យ!')">Clear</button>
        </div>
    </div>

    <a href="index.html" class="back-link">⬅️ ត្រឡប់ទៅទំព័រដើម Browser</a>
</body>
</html>
