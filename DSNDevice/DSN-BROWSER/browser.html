<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>📑 DSN Tabs - Sideth</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #030712; --card-bg: rgba(15, 23, 42, 0.85); --border-color: rgba(56, 189, 248, 0.3); --accent: #38bdf8; --text-main: #f8fafc; --text-sub: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        header h1 { font-size: 16px; color: var(--accent); }
        .btn-add { background: var(--accent); color: #030712; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .tabs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tab-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; height: 110px; position: relative; }
        .tab-title { font-size: 13px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .tab-actions { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-sub); }
        .btn-close { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .back-link { display: block; text-align: center; color: var(--text-sub); text-decoration: none; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>📑 DSN Tabs Manager</h1>
        <button class="btn-add" onclick="addNewTab()">+ Tab ថ្មី</button>
    </header>

    <div class="tabs-grid" id="tabsContainer">
        <!-- Dynamic Tabs -->
        <div class="tab-card">
            <div class="tab-title">🌐 Google Search Engine</div>
            <div class="tab-actions">
                <span>Active</span>
                <button class="btn-close" onclick="this.parentElement.parentElement.remove()">✕</button>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link">⬅️ ត្រឡប់ទៅទំព័រដើម Browser</a>

    <script>
        function addNewTab() {
            let container = document.getElementById('tabsContainer');
            let card = document.createElement('div');
            card.className = 'tab-card';
            card.innerHTML = `
                <div class="tab-title">🌐 New DSN Tab</div>
                <div class="tab-actions">
                    <span>New</span>
                    <button class="btn-close" onclick="this.parentElement.parentElement.remove()">✕</button>
                </div>
            `;
            container.appendChild(card);
        }
    </script>
</body>
</html>
