<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🎮 DSN Emulator Player - Sideth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #030712; color: #38bdf8; font-family: 'Kantumruy Pro', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 600px; background: rgba(15,23,42,0.85); border: 1px solid rgba(56,189,248,0.3); border-radius: 20px; padding: 20px; text-align: center; }
        h1 { color: #f8fafc; font-size: 18px; margin-bottom: 15px; }
        .screen-box { width: 100%; height: 350px; background: #000; border-radius: 12px; border: 1px solid #38bdf8; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 15px; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-back { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #1e293b; color: #94a3b8; border-radius: 12px; text-decoration: none; font-weight: bold; border: 1px solid rgba(148,163,184,0.2); }
        .btn-back:hover { background: #334155; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="gameTitle">🕹️ កំពុងរៀបចំ Emulator...</h1>
        <div class="screen-box" id="emulatorScreen">
            <p style="color: #94a3b8; font-size: 14px;">សូមរង់ចាំបន្តិច...</p>
        </div>
        <a href="game_library.html" class="btn-back">⬅️ ត្រឡប់ទៅបណ្ណាល័យហ្គេម</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title') || 'PS2 Game';
        const gameFile = urlParams.get('game');

        document.getElementById('gameTitle').textContent = `🎮 ${title}`;

        const screenBox = document.getElementById('emulatorScreen');
        if (gameFile) {
            const playUrl = `https://polished-paper-2014.sansidet63.workers.dev/?game=${encodeURIComponent(gameFile)}`;
            screenBox.innerHTML = `<iframe src="${playUrl}" allowfullscreen></iframe>`;
        } else {
            screenBox.innerHTML = `<p style="color: #f43f5e;">⚠️ រកមិនឃើញហ្គេមសម្រាប់លេងទេប្រុសស្អិត!</p>`;
        }
    </script>
</body>
</html>
