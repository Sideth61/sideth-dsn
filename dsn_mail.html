<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>DSN Email Bridge</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,"Noto Sans Khmer",sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#35205e,#070912 55%,#02030a);padding:18px}
.app{max-width:520px;margin:auto}.hero,.card{background:rgba(15,18,35,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 18px 50px #0008;padding:20px;margin-bottom:14px}.hero{text-align:center}.logo{font-size:46px}.title{font-size:22px;font-weight:800}.muted{color:#aeb5c8;font-size:12px;line-height:1.7}.row{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff12}.row:last-child{border:0}.dot{width:10px;height:10px;border-radius:50%;background:#64748b;flex:0 0 auto}.dot.ok{background:#22c55e;box-shadow:0 0 12px #22c55e}.dot.bad{background:#ef4444}.name{flex:1;font-size:13px;font-weight:700}.status{font-size:11px;color:#aeb5c8}.btn{width:100%;border:0;border-radius:14px;padding:13px;color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);font-weight:800;margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="logo">📩🤖</div>
    <div class="title">DSN Email Bridge</div>
    <div class="muted">5 Email → @sideth_bot → Telegram</div>
  </section>
  <section class="card">
    <div class="muted">PIN សម្រាប់ Admin API</div>
    <input id="pin" inputmode="numeric" type="password" placeholder="253507" style="width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff18;background:#080b15;color:#fff;margin-top:7px">
    <button class="btn" id="refresh">🔄 ពិនិត្យស្ថានភាព</button>
    <div id="list" style="margin-top:8px"></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
async function load(){
  const pin=$("pin").value.trim();
  const r=await fetch("/api/status",{headers:{"x-dsn-pin":pin}});
  const d=await r.json();
  if(!r.ok) throw Error(d.error||"Error");
  $("list").innerHTML=Object.entries(d.runtime).map(([id,s])=>`
    <div class="row">
      <span class="dot ${s.status==="online"?"ok":"bad"}"></span>
      <div class="name">${id}</div>
      <div class="status">${s.status}</div>
    </div>`).join("");
}
$("refresh").onclick=()=>load().catch(e=>alert(e.message));
</script>
</body>
</html>
