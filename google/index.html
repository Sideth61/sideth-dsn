<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN AI Google - Sideth AI Chat V3.6</title>

    <!-- 🌐 Open Graph Meta Tags សម្រាប់បង្ហាញរូបភាពពេល Share ចូល Facebook -->
    <meta property="og:title" content="DSN Google AI - Sideth AI Chat V3.6">
    <meta property="og:description" content="DSN Google AI បង្កើតដោយខ្ញុំផ្ទាល់😘❤️ គ្រាន់តែ Copy Key យកទៅដាក់ក្នុង ផ្នែក ខាង ក្រៅ 🔑 API">
    <meta property="og:image" content="https://sideth.site/image.png">
    <meta property="og:url" content="https://sideth.site">
    <meta property="og:type" content="website">

    <!-- 📱 PWA / Add to Home Screen Icons -->
    <link rel="apple-touch-icon" href="sideth-ai.jpg">
    <link rel="icon" type="image/jpeg" href="sideth-ai.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sideth AI">

    <!-- 🔤 Google Fonts សម្រាប់ហ្វុនខ្មែរស្អាតៗ -->
    <link href="https://fonts.googleapis.com/css2?family=Preahvihear&family=Kantumruy+Pro:wght@300;400;500;700&family=Battambang:wght@400;700&family=Siemreap&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kantumruy Pro', 'Battambang', 'Preahvihear', 'Siemreap', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 {
            font-size: 15px;
            margin: 0;
            font-family: 'Preahvihear', sans-serif;
            color: #38bdf8;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.ai {
            background: #1e293b;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .message.user {
            background: #3b82f6;
            color: #fff;
            align-self: flex-end;
        }
        .input-area {
            padding: 12px;
            background: rgba(30, 41, 59, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type="text"] {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-family: 'Kantumruy Pro', sans-serif;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            padding: 10px 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👮DSN Google AI SIDETH (V3.6)👮</h1>
        <div style="display: flex; gap: 6px;">
            <button onclick="setApiKey()" style="padding: 6px 10px; background: #3b82f6; font-size: 11px;">🔑 API</button>
            <button onclick="clearHistory()" style="padding: 6px 10px; background: #ef4444; font-size: 11px;">🗑️ លុប</button>
        </div>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai">សួស្ដីបាទ ខ្ញុំឈ្មោះ ស៊ីដេត តើអ្នកចង់ឱ្យខ្ញុំជួយអ្នករឿងអ្វី 😘💚</div>
    </div>
    
    <div class="input-area" style="display: flex; flex-direction: column; gap: 8px;">
        <div id="previewContainer" style="display: none; align-items: center; gap: 10px;">
            <img id="imagePreview" src="" alt="Preview" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);">
            <span style="font-size: 12px; color: #94a3b8;">បានជ្រើសរើសរូបភាពរួចរាល់ 🖼️</span>
            <button onclick="removeImage()" style="padding: 4px 8px; background: #ef4444; font-size: 12px;">លុបចេញ</button>
        </div>

        <div style="display: flex; width: 100%; gap: 8px; align-items: center;">
            <label for="imageInput" style="padding: 10px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                📷
            </label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewSelectedImage(event)" />
            <input type="text" id="userInput" placeholder="សរសេរការបញ្ជា ឬសួរសំណួរទីនេះ..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        let selectedImageBase64 = null;
        let selectedImageMimeType = "image/jpeg";

        window.onload = function() {
            const savedChat = localStorage.getItem('dsn_chat_history_v3_6');
            if (savedChat) {
                document.getElementById('chatBox').innerHTML = savedChat;
                scrollToBottom();
            }
            if (!localStorage.getItem('gemini_user_key')) {
                setTimeout(setApiKey, 500);
            }
        };

        function setApiKey() {
            let currentKey = localStorage.getItem('gemini_user_key') || '';
            let userKey = prompt("🔑 សូមបញ្ចូល Google Gemini API Key របស់បងទីនេះ:", currentKey);
            if (userKey !== null && userKey.trim() !== "") {
                localStorage.setItem('gemini_user_key', userKey.trim());
                alert("រក្សាទុក API Key សុវត្ថិភាពរួចរាល់ហើយ មាសស្នេហ៍! 😘✨");
            }
        }

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedImageMimeType = file.type;
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveChatHistory() {
            const chatBox = document.getElementById('chatBox').innerHTML;
            localStorage.setItem('dsn_chat_history_v3_6', chatBox);
        }

        function clearHistory() {
            localStorage.removeItem('dsn_chat_history_v3_6');
            document.getElementById('chatBox').innerHTML = `<div class="message ai">សួស្ដីបង Sideth❤️️ អូន NiTa❤️️ បានសម្អាតប្រវត្តិជជែករួចរាល់ហើយ! 😘</div>`;
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('gemini_user_key');
            if (!apiKey) {
                alert("សូមកំណត់ API Key ជាមុនសិន!");
                setApiKey();
                return;
            }

            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = input.value.trim();
            if (!message && !selectedImageBase64) return;

            let userHtml = `<div class="message user">`;
            if (selectedImageBase64) {
                userHtml += `<img src="data:${selectedImageMimeType};base64,${selectedImageBase64}" style="max-width: 150px; border-radius: 8px; display: block; margin-bottom: 6px;">`;
            }
            if (message) {
                userHtml += `<span>${message}</span>`;
            }
            userHtml += `</div>`;
            chatBox.innerHTML += userHtml;

            const currentInput = message;
            const currentImg = selectedImageBase64;
            const currentMime = selectedImageMimeType;

            input.value = '';
            removeImage();
            scrollToBottom();
            saveChatHistory();

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message ai" id="${loadingId}">ស៊ីដេត កំពុងគិតចម្លើយជូនអ្នក..... ⏳</div>`;
            scrollToBottom();

            try {
                let parts = [];
                if (currentInput) {
                    parts.push({ text: currentInput });
                }
                if (currentImg) {
                    parts.push({
                        inlineData: {
                            mimeType: currentMime,
                            data: currentImg
                        }
                    });
                }

                const requestBody = {
                    contents: [{ parts: parts }]
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                const aiMessageElement = document.getElementById(loadingId);

                if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    aiMessageElement.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    console.error("API Error Details:", data);
                    aiMessageElement.innerText = "អុញណ៎! មានបញ្ហា៖ " + (data.error?.message || "សូមពិនិត្យមើល API Key ឡើងវិញ មាសស្នេហ៍!");
                }
                scrollToBottom();
                saveChatHistory();
            } catch (error) {
                document.getElementById(loadingId).innerText = "សូមអភ័យទោស! មិនអាចតភ្ជាប់ទៅកាន់ Google API បានទេ (Connection Error)។ 🔌";
                scrollToBottom();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
