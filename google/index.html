<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN AI Studio - Google AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Preahvihear&display=swap" rel="stylesheet">
    <!-- តភ្ជាប់ជាមួយហ្វាល Style ខាងក្រៅ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>🤖 DSN Google AI Studio</h1>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai">បាទ/ចាស៑! សួស្ដីបង Sideth❤️️ តើថ្ងៃនេះចង់ឱ្យអូនជំនួយការអ្វីដែរចាស៑? 😘</div>
    </div>
    
    <div class="input-area" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- ប្រអប់ Preview រូបភាពមុននឹងផ្ញើឱ្យ AI Edit -->
        <div id="previewContainer" style="display: none; align-items: center; gap: 10px;">
            <img id="imagePreview" src="" alt="Preview" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color);">
            <span style="font-size: 12px; color: var(--text-sub);">បានជ្រើសរើសរូបភាពរួចរាល់ 🖼️</span>
            <button onclick="removeImage()" style="padding: 4px 8px; background: #ef4444; font-size: 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer;">លុបចេញ</button>
        </div>

        <div style="display: flex; width: 100%; gap: 8px; align-items: center;">
            <!-- ប៊ូតុងជ្រើសរើសរូបភាព -->
            <label for="imageInput" style="padding: 10px 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                📷
            </label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewSelectedImage(event)" />

            <!-- ប្រអប់សរសេរសំណួរ ឬបញ្ជាកែរូបភាព -->
            <input type="text" id="userInput" placeholder="សរសេរការបញ្ជា ឬកែសម្រួលរូបភាពទីនេះ..." onkeypress="handleKeyPress(event)" style="flex: 1;" />
            
            <!-- ប៊ូតុងបញ្ជូន -->
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        let selectedImageBase64 = null;

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = selectedImageBase64;
                    document.getElementById('previewContainer').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = input.value.trim();
            if (!message && !selectedImageBase64) return;

            // បង្ហាញសារ ឬរូបភាពរបស់ User
            let userHtml = `<div class="message user">`;
            if (selectedImageBase64) {
                userHtml += `<img src="${selectedImageBase64}" style="max-width: 150px; border-radius: 8px; display: block; margin-bottom: 6px;">`;
            }
            if (message) {
                userHtml += `<span>${message}</span>`;
            }
            userHtml += `</div>`;
            chatBox.innerHTML += userHtml;

            const currentImage = selectedImageBase64;
            input.value = '';
            removeImage();
            chatBox.scrollTop = chatBox.scrollHeight;

            // បង្ហាញ Loading ពេល AI កំពុងដំណើរការ
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message ai" id="${loadingId}">កំពុងគិត និងរៀបចំកែសម្រួល... ⏳</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: message, image: currentImage })
                });

                const data = await response.json();
                const aiMessageElement = document.getElementById(loadingId);

                if (response.ok && data.reply) {
                    aiMessageElement.innerText = data.reply;
                } else {
                    aiMessageElement.innerText = data.error || "អុញណ៎! មានបញ្ហាប្រព័ន្ធបន្តិច មាសស្នេហ៍សាកល្បងម្ដងទៀតណា! 😅";
                }
            } catch (error) {
                document.getElementById(loadingId).innerText = "សូមអភ័យទោស! មិនអាចតភ្ជាប់ទៅកាន់ Server បានទេ (Connection Error)។ 🔌";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
