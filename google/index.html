<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSN AI Studio - Google AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Preahvihear&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>🤖 DSN Google AI Studio</h1>
        <div style="display: flex; gap: 6px;">
            <button onclick="setApiKey()" style="padding: 6px 10px; background: #3b82f6; font-size: 11px; border:none; border-radius:4px; color:#fff; cursor:pointer;" title="កំណត់ API Key">🔑 API</button>
            <button onclick="clearHistory()" style="padding: 6px 10px; background: #ef4444; font-size: 11px; border:none; border-radius:4px; color:#fff; cursor:pointer;" title="លុបប្រវត្តិ Chat">🗑️ លុប</button>
        </div>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="message ai">បាទ/ចាស៑! សួស្ដីបង Sideth❤️️ តើថ្ងៃនេះចង់ឱ្យអូនជំនួយការអ្វីដែរចាស៑? 😘</div>
    </div>
    
    <div class="input-area" style="display: flex; flex-direction: column; gap: 8px;">
        <div id="previewContainer" style="display: none; align-items: center; gap: 10px;">
            <img id="imagePreview" src="" alt="Preview" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color);">
            <span style="font-size: 12px; color: var(--text-sub);">បានជ្រើសរើសរូបភាពរួចរាល់ 🖼️</span>
            <button onclick="removeImage()" style="padding: 4px 8px; background: #ef4444; font-size: 12px; border: none; border-radius: 4px; color: #fff; cursor: pointer;">លុបចេញ</button>
        </div>

        <div style="display: flex; width: 100%; gap: 8px; align-items: center;">
            <label for="imageInput" style="padding: 10px 14px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                📷
            </label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewSelectedImage(event)" />

            <input type="text" id="userInput" placeholder="សរសេរការបញ្ជា ឬសួរសំណួរទីនេះ..." onkeypress="handleKeyPress(event)" style="flex: 1;" />
            
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        let selectedImageBase64 = null;
        let selectedImageMimeType = "image/jpeg";

        window.onload = function() {
            const savedChat = localStorage.getItem('dsn_chat_history');
            if (savedChat) {
                document.getElementById('chatBox').innerHTML = savedChat;
                scrollToBottom();
            }
            if (!localStorage.getItem('gemini_user_key')) {
                setTimeout(setApiKey, 500);
            }
        };

        function setApiKey() {
            let currentKey = localStorage.getItem('gemini_user_key') || '';
            let userKey = prompt("🔑 សូមបញ្ចូល Google Gemini API Key របស់បងទីនេះ:", currentKey);
            if (userKey !== null && userKey.trim() !== "") {
                localStorage.setItem('gemini_user_key', userKey.trim());
                alert("រក្សាទុក API Key សុវត្ថិភាពរួចរាល់ហើយ មាសស្នេហ៍! 😘✨");
            }
        }

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedImageMimeType = file.type;
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result.split(',')[1];
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewContainer').style.display = 'none';
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveChatHistory() {
            const chatBox = document.getElementById('chatBox').innerHTML;
            localStorage.setItem('dsn_chat_history', chatBox);
        }

        function clearHistory() {
            localStorage.removeItem('dsn_chat_history');
            document.getElementById('chatBox').innerHTML = `<div class="message ai">បាទ/ចាស៑! សួស្ដីបង Sideth❤️️ តើថ្ងៃនេះចង់ឱ្យអូនជំនួយការអ្វីដែរចាស៑? 😘</div>`;
        }

        async function sendMessage() {
            const apiKey = localStorage.getItem('gemini_user_key');
            if (!apiKey) {
                alert("សូមកំណត់ API Key ជាមុនសិន!");
                setApiKey();
                return;
            }

            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const message = input.value.trim();
            if (!message && !selectedImageBase64) return;

            let userHtml = `<div class="message user">`;
            if (selectedImageBase64) {
                userHtml += `<img src="data:${selectedImageMimeType};base64,${selectedImageBase64}" style="max-width: 150px; border-radius: 8px; display: block; margin-bottom: 6px;">`;
            }
            if (message) {
                userHtml += `<span>${message}</span>`;
            }
            userHtml += `</div>`;
            chatBox.innerHTML += userHtml;

            const currentInput = message;
            const currentImg = selectedImageBase64;
            const currentMime = selectedImageMimeType;

            input.value = '';
            removeImage();
            scrollToBottom();
            saveChatHistory();

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div class="message ai" id="${loadingId}">Gemini កំពុងគិតចម្លើយ... ⏳</div>`;
            scrollToBottom();

            try {
                let contents = [];
                let parts = [];
                if (currentInput) parts.push({ text: currentInput });
                if (currentImg) {
                    parts.push({
                        inline_data: {
                            mime_type: currentMime,
                            data: currentImg
                        }
                    });
                }
                contents.push({ parts: parts });

                // ប្រើប្រាស់ gemini-1.5-flash ដែលជា Model ស្តង់ដារទូទៅទាន់សម័យ
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();
                const aiMessageElement = document.getElementById(loadingId);

                if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    aiMessageElement.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    console.error("API Error Details:", data);
                    aiMessageElement.innerText = "អុញណ៎! មានបញ្ហាបន្តិច៖ " + (data.error?.message || "សូមពិនិត្យមើល API Key ឡើងវិញណា មាសស្នេហ៍! 😅");
                }
                scrollToBottom();
                saveChatHistory();
            } catch (error) {
                document.getElementById(loadingId).innerText = "សូមអភ័យទោស! មិនអាចតភ្ជាប់ទៅកាន់ Google API បានទេ (Connection Error)។ 🔌";
                scrollToBottom();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
